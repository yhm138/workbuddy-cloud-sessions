  /* ================= 路由 & 事件 ================= */
  function route() {
    var h = location.hash.replace(/^#/, "");
    if (/^\/s\//.test(h)) {
      var parts = h.split("/").filter(Boolean); // s, id, idx?
      var id = parts[1];
      var idx = parts[2] != null ? Number(parts[2]) : null;
      if (id && (!state.current || state.current.id !== id)) openDetail(id, idx);
      return;
    }
    if (h === "/stats") { openStats(); return; }
    if (/^\/q\//.test(h)) {
      var qq = decodeURIComponent(h.slice(3));
      document.getElementById("q").value = qq;
      document.getElementById("scope").value = "all";
      state.q = qq; state.scope = "all";
      if (state.view === "detail") closeDetail();
      render();
      return;
    }
    if (state.view === "detail") {
      document.getElementById("detailView").classList.remove("on");
      document.getElementById("listView").classList.remove("off");
      state.current = null;
    }
    if (state.view === "stats") {
      document.getElementById("statsView").classList.remove("on");
      document.getElementById("listView").classList.remove("off");
    }
    state.view = "list";
    render();
  }

  function syncChrome() {
    document.body.dataset.view = state.view;
  }

  function render() {
    syncChrome();
    if (state.view === "search") renderSearch();
    else renderList();
  }

  var qTimer;
  document.getElementById("q").addEventListener("input", function (ev) {
    state.q = ev.target.value.trim();
    state.view = state.q ? "list" : "list";
    clearTimeout(qTimer);
    if (state.scope === "all" && state.q.length >= 2) {
      qTimer = setTimeout(function () { state.view = "search"; render(); }, 220);
    } else {
      render();
    }
  });
  document.getElementById("q").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") {
      state.q = ev.target.value.trim();
      if (state.q.length >= 2) {
        document.getElementById("scope").value = "all";
        state.scope = "all";
        state.view = "search";
        render();
      }
    } else if (ev.key === "Escape") {
      ev.target.value = ""; state.q = ""; state.view = "list"; render();
    }
  });
  document.getElementById("scope").addEventListener("change", function (ev) {
    state.scope = ev.target.value;
    if (state.scope === "all" && state.q.length >= 2) { state.view = "search"; render(); }
    else { state.view = "list"; render(); }
  });

  /* 列表页「更多」菜单（和详情页同一套样式，只是面板不同） */
  (function bindListMenu() {
    var b = document.getElementById("listMore");
    var m = document.getElementById("listMenu");
    if (!b || !m) return;
    b.onclick = function (ev) {
      ev.stopPropagation();
      m.hidden = !m.hidden;
      b.setAttribute("aria-expanded", m.hidden ? "false" : "true");
    };
    m.addEventListener("click", function (ev) {
      if (!ev.target.closest("button")) return;
      setTimeout(function () { m.hidden = true; b.setAttribute("aria-expanded", "false"); }, 0);
    });
    document.addEventListener("click", function (ev) {
      if (m.hidden) return;
      if (m.contains(ev.target) || ev.target === b) return;
      m.hidden = true;
      b.setAttribute("aria-expanded", "false");
    });
  })();

  document.getElementById("back").onclick = closeDetail;
  document.getElementById("sBack").onclick = closeDetail;
  document.getElementById("statsBtn").onclick = openStats;
  document.getElementById("syncBtn").onclick = syncLive;

  document.getElementById("fillAllBtn").onclick = function () {
    if (SB.state() !== "ok") {
      toast("云端直连不可用：本次部署没有 service，或它没起来");
      return;
    }
    var todo = DATA.items.filter(function (it) { return !(it.n > 0); });
    if (!todo.length) { toast("所有会话都有正文了"); return; }
    toast("开始补 " + todo.length + " 条，可以继续用面板");
    startFill(todo, { label: "从云端补正文" });
  };

  document.getElementById("dPull").onclick = function () {
    var it = state.current;
    if (!it) return;
    if (SB.state() !== "ok") { toast("云端直连不可用"); return; }
    toast("正在从云端拉…");
    SB.fetchBody(it.id, { force: true }).then(function (r) {
      var shard = r.shard || r;
      shard.id = it.id;
      acceptShard(it, shard, "cloud");
      toast("已拉到 " + (shard.messages || []).length + " 条 · 云端最新");
      openDetail(it.id);
      render();
    }).catch(function (e) {
      log("cloud/pull-fail", e.message);
      toast("拉取失败：" + briefText(e.message, 90), 2600);
    });
  };

  document.getElementById("dWeb").onclick = function () {
    if (!state.current) return;
    openExternal(webUrl(state.current.id));
  };
  document.getElementById("webBtn").onclick = function () { openExternal(WEB + "/app"); };

  document.getElementById("dCopy").onclick = function () {
    if (state.current) copy(state.current.id, "已复制会话 ID");
  };
  document.getElementById("dFav").onclick = function () {
    if (!state.current) return;
    var added = toggleFav(state.current.id);
    setFavLabel(added);
    toast(added ? "已收藏（列表置顶）" : "已取消收藏");
  };
  document.getElementById("dMd").onclick = function () {
    if (!state.current) return;
    var s = SESSIONS[state.current.id];
    if (s && (s.messages || []).length) {
      var md0 = toMarkdown(s);
      copy(md0, "已复制 " + md0.length + " 字符 Markdown");
      return;
    }
    loadSession(state.current.id, function (err, shard) {
      if (err || !shard) return toast("这条会话没有本地正文");
      var md = toMarkdown(shard);
      copy(md, "已复制 " + md.length + " 字符 Markdown");
    });
  };

  document.getElementById("dChat").onclick = function () {
    if (state.current) continueIn(state.current, this);
  };
  document.getElementById("dChatForce").onclick = function () {
    if (state.current) openSessionInClient(state.current.id, { force: true });
  };

  /* 面板是只读的：不在面板里发消息，也不再假装能替用户填输入框。
     要继续对话只有两条路 —— 客户端的融合会话，或者网页版。 */
  function continueIn(it, btn) {
    if (!it) return;
    if (btn) {
      var old = btn.textContent;
      btn.textContent = webFirst(it.origin) ? "正在交给浏览器…" : "正在切过去…";
      btn.disabled = true;
      setTimeout(function () { btn.textContent = old; btn.disabled = false; }, 1600);
    }
    if (webFirst(it.origin)) return openExternal(webUrl(it.id), "网页版");
    openSessionInClient(it.id);
  }
  function continueWeb(it) {
    if (it) openExternal(webUrl(it.id), "网页版");
  }

  /* 小程序 / App 来源的会话：客户端里通常只有一条空壳（「暂无对话记录」），
   * 真正的历史只在云端。这类不给「回到会话」设陷阱，先问一句去哪儿。 */
  function webFirst(origin) {
    return origin === "workbuddy-mp" || origin === "workbuddy-app";
  }
  function pickModal(title, sub, tip, aLabel, onA, bLabel, onB) {
    var m = document.getElementById("pickModal");
    document.getElementById("pickTitle").textContent = title;
    document.getElementById("pickSub").textContent = sub;
    document.getElementById("pickTip").textContent = tip || "";
    var a = document.getElementById("pickA");
    var b = document.getElementById("pickB");
    a.textContent = aLabel;
    b.textContent = bLabel;
    a.onclick = function () { m.hidden = true; if (onA) onA(); };
    b.onclick = function () { m.hidden = true; if (onB) onB(); };
    document.getElementById("pickX").onclick = function () { m.hidden = true; };
    m.hidden = false;
    b.focus({ preventScroll: true });
  }

  /* -------- 顶栏「更多」菜单 -------- */
  var dMoreBtn = document.getElementById("dMore");
  var dMenuEl = document.getElementById("dMenu");
  function closeMenu() {
    if (!dMenuEl) return;
    dMenuEl.hidden = true;
    dMoreBtn.setAttribute("aria-expanded", "false");
  }
  dMoreBtn.onclick = function (ev) {
    ev.stopPropagation();
    dMenuEl.hidden = !dMenuEl.hidden;
    dMoreBtn.setAttribute("aria-expanded", dMenuEl.hidden ? "false" : "true");
  };
  dMenuEl.addEventListener("click", function (ev) {
    if (ev.target.closest("button[data-close]")) setTimeout(closeMenu, 0);
  });
  document.addEventListener("click", function (ev) {
    if (dMenuEl.hidden) return;
    if (dMenuEl.contains(ev.target) || ev.target === dMoreBtn) return;
    closeMenu();
  });

  /* -------- 收藏标签 / 底部输入条 -------- */
  function setFavLabel(on) {
    var b = document.getElementById("dFav");
    if (!b) return;
    var sp = b.querySelector("span");
    if (sp) sp.textContent = on ? "取消收藏" : "收藏";
    else b.textContent = on ? "★" : "☆";
  }


  // 会话内查找
  function openFind() {
    document.getElementById("findbar").classList.add("on");
    var fq = document.getElementById("fq");
    fq.focus(); fq.select();
  }
  document.getElementById("dFind").onclick = openFind;
  document.getElementById("fclose").onclick = function () {
    document.getElementById("findbar").classList.remove("on");
    clearHits();
  };
  document.getElementById("fprev").onclick = function () { jumpHit(state.hitIdx - 1); };
  document.getElementById("fnext").onclick = function () { jumpHit(state.hitIdx + 1); };
  var fTimer;
  document.getElementById("fq").addEventListener("input", function (ev) {
    clearTimeout(fTimer);
    var v = ev.target.value;
    fTimer = setTimeout(function () { findInSession(v); }, 200);
  });
  document.getElementById("fq").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") {
      ev.preventDefault();
      if (ev.shiftKey) jumpHit(state.hitIdx - 1); else jumpHit(state.hitIdx + 1);
    } else if (ev.key === "Escape") {
      document.getElementById("fclose").onclick();
    }
  });

  // 键盘
  document.addEventListener("keydown", function (ev) {
    var tag = (ev.target && ev.target.tagName || "").toLowerCase();
    var typing = tag === "input" || tag === "select" || tag === "textarea";

    if (ev.key === "Escape" && !typing) {
      var pm = document.getElementById("pickModal");
      if (pm && !pm.hidden) { pm.hidden = true; return; }
      var sm = document.getElementById("snapModal");
      if (sm && !sm.hidden) { sm.hidden = true; return; }
      var dm2 = document.getElementById("dMenu");
      if (dm2 && !dm2.hidden) { closeMenu(); return; }
      if (state.view === "detail" || state.view === "stats") closeDetail();
      return;
    }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "f") {
      if (state.view === "detail") { ev.preventDefault(); openFind(); }
      return;
    }
    if (typing) return;

    if (ev.key === "/") { ev.preventDefault(); document.getElementById("q").focus(); return; }
    if (ev.key === "r") { syncLive(); return; }
    if (ev.key === "?" ) { openStats(); return; }
    if (state.view !== "list" && state.view !== "search") return;

    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      var rows = document.querySelectorAll("#listView .row, #listView .hit");
      if (!rows.length) return;
      var cur = document.querySelector("#listView .row.sel, #listView .hit.sel");
      var i = cur ? Array.prototype.indexOf.call(rows, cur) : -1;
      if (cur) cur.classList.remove("sel");
      i = ev.key === "ArrowDown" ? Math.min(rows.length - 1, i + 1) : Math.max(0, i - 1);
      rows[i].classList.add("sel");
      rows[i].scrollIntoView({ block: "nearest" });
      return;
    }
    if (ev.key === "Enter") {
      var sel = document.querySelector("#listView .row.sel, #listView .hit.sel");
      if (sel) sel.click();
    }
  });
  window.addEventListener("hashchange", route);

  /* ================= 启动 ================= */
  (function boot() {
    routeLinks(document.getElementById("dBody"));
    renderStamp();
    setInterval(renderStamp, 60000);

    // 诊断信息（宿主通道状态是排查「插件加载失败」的关键）
    function refreshDiag() {
      var out = [];
      var g = window.__WBCS_GUEST__ || null;
      out.push("snapshot  : " + DATA.generatedAt + " / " + DATA.total + " 条");
      out.push("url       : " + location.href);
      out.push("origin    : " + location.origin);
      out.push("in iframe : " + (window.parent !== window));
      out.push("ipc      : " + (typeof window.__wbInvoke === "function" ? " __wbInvoke 可用" : " 无，退回 MessagePort"));
      out.push("宿主通道  : " + (g && g.port
        ? ("MessagePort" + (g.ready ? "（ready 已确认）" : "（ready 未确认）"))
        : "未建立（只剩浏览器兜底）"));
      /* 探活可能还没回来（或先被一次 fetchBody 置成 ok），info 为空时不能直接点属性 */
      var si = SB.info() || {};
      out.push("云端直连  : " + (SB.state() === "ok"
        ? ("service v" + (si.version || "?") +
          (si.pid ? " · pid " + si.pid : "") +
          (si.cache != null ? " · " + si.cache + " 条缓存" : "") +
          " · via " + SB.style())
        : SB.state() === "off" ? ("不可用 —— " + SB.error()) : "检测中…"));
      var lf = typeof SB.last === "function" ? SB.last() : null;
      if (lf) {
        var tm = (lf.shard && lf.shard.timings) || {};
        var head = lf.cached
          ? "缓存命中（" + (lf.cached === "ts" ? "云端未更新" : "3 分钟内") + "）"
          : (Math.round((lf.elapsed || 0) / 100) / 10) + "s";
        out.push("上次回放  : " + head +
          (lf.cached ? "" :
            "（票据 " + (tm.ticket || 0) + " / 握手 " + (tm.connect || 0) +
            " / 首帧 " + (tm.firstFrame || 0) + " / 回放 " + (tm.replay || 0) + "ms）") +
          " · " + ((lf.shard && (lf.shard.messages || []).length) || 0) + " 条");
      }
      if (g && g.lines && g.lines.length) out.push("guest     : " + g.lines.join(" | "));
      setDiagHeader(out);
    }
    refreshDiag();
    [300, 1500, 4000, 8000].forEach(function (ms) { setTimeout(refreshDiag, ms); });

    // 分片索引（哪些会话有本地正文）
    var s = document.createElement("script");
    s.src = "./full/index.js";
    s.onload = function () {
      var meta = window.__WBCS_INDEX__ || {};
      (meta.items || []).forEach(function (x) { INDEX[x.id] = x; });
      // 用分片统计修正列表里的条数（DB 里没有正文条数）
      DATA.items.forEach(function (it) {
        var m = INDEX[it.id];
        if (m) it.n = m.n;
      });
      log("full/index", (meta.total || 0) + " 份正文，合计 " + Math.round((meta.bytes || 0) / 1024) + " KB");
      if (state.view !== "detail" && state.view !== "stats") render();
    };
    s.onerror = function () { log("full/index", "没有本地正文分片（先跑 build）"); };
    document.head.appendChild(s);

    // 宿主桥 / 主题：等 MessagePort 建好（宿主在 iframe load 后马上发），
    // 最多等 4s；等不到就当作纯浏览器环境，直接降级。
    (function bridgeUp() {
      var g = window.__WBCS_GUEST__;
      if (g && !g.port && window.parent !== window) {
        var tries = 0;
        var iv = setInterval(function () {
          if ((g && g.port) || ++tries > 40) { clearInterval(iv); finish(); }
        }, 100);
      } else {
        finish();
      }

      function finish() {
        Bridge.handshake(800).then(function () {
          log("bridge", "ok via " + Bridge.via());
          refreshDiag();
          // 云端直连探活：拿不到 service 就永久降级，面板行为回到 1.8.0
          SB.probe().then(function () {
            refreshDiag();
            SB.warm();                    // 顺手把到网关的 TLS 连接建好
            setTimeout(prefetchRecent, 400);
          }).catch(function () { refreshDiag(); });
          return Bridge.invoke("wb:config:get", ["theme"], 3000).then(function (t) {
            var v = typeof t === "string" ? t : (t && (t.theme || t.mode));
            if (v === "dark" || v === "light") {
              document.documentElement.dataset.theme = v;
              log("theme", v);
            }
          }).catch(function () {});
        }).catch(function (e) {
          log("bridge", "unavailable: " + e.message);
          refreshDiag();
        });
      }
    })();

    route();

    /* 自动同步：打开面板就拉一次列表；之后每次重新可见（60s 节流）再拉。
     * 宿主 keepAlive，iframe 不会重启，只能靠可见性/焦点变化判断「又点进来了」。 */
    setTimeout(function () { autoSync("open"); }, 1200);
    (function autoSyncTriggers() {
      var mainEl = document.getElementById("main") || document.body;
      var wasOn = true;
      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (entries) {
          var e = entries[0];
          var on = !!(e && e.isIntersecting && e.intersectionRatio > 0);
          if (on && !wasOn) autoSync("visible");
          wasOn = on;
        }, { threshold: [0, 0.01] }).observe(mainEl);
      }
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) autoSync("tab");
      });
      window.addEventListener("focus", function () { autoSync("focus"); });
    })();

    // 版本自检：宿主的扩展清单在启动时快照，热部署后 URL 上的 v= 还是旧版本。
    // 出现不一致说明「文件已经换了、宿主还没重新扫」——重启即可，不是网络问题。
    (function versionCheck() {
      var want = "";
      try { want = (new URLSearchParams(location.search).get("v") || "").trim(); } catch (e) {}
      log("version", "host=" + (want || "-") + " disk=" + PAGE_VERSION);
      if (!want || want === PAGE_VERSION) return;
      var bar = el("div", "vbar");
      bar.appendChild(el("span", "vbar-txt",
        "版本不一致：宿主仍在用 v" + want + " 的清单，磁盘上已经是 v" + PAGE_VERSION +
        "。这是更新后没重启导致的（面板可能会报「插件加载失败」）。完全退出 WorkBuddy 再打开即可。" ));
      var btn = el("button", null, "知道了");
      btn.onclick = function () { bar.remove(); };
      bar.appendChild(btn);
      var m = document.getElementById("main");
      if (m) m.insertBefore(bar, m.firstChild);
    })();
  })();
})();
</script>
</body>
</html>
