<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>云端会话</title>
<style>
  /* ---------- 设计令牌：对齐客户端（renderer 的 --wb-* 体系取色） ---------- */
  :root {
    --bg: #ffffff;
    --bg-soft: #f7f7f8;          /* 客户端 bg-secondary */
    --bg-hover: rgba(0, 0, 0, .05);   /* 客户端 --wb-bg-hover */
    --bg-active: rgba(0, 0, 0, .08);  /* 客户端 --wb-bg-active */
    --fg: rgba(0, 0, 0, .9);     /* --wb-text-strong #000000e6 */
    --fg-dim: rgba(0, 0, 0, .55); /* --wb-text-medium #000000b3 */
    --fg-mute: rgba(0, 0, 0, .35);
    --line: rgba(0, 0, 0, .08);  /* --wb-border-default */
    --line-soft: rgba(0, 0, 0, .05);
    --accent: rgba(0, 0, 0, .9); /* 客户端主按钮是黑底 */
    --accent-fg: #fff;
    --me: #f4f5f7;
    --ai: transparent;
    --mark: #ffe58f;
    --mark-fg: #000000e6;
    --badge-web: #2f6feb;
    --badge-mp: #16a34a;
    --badge-task: #b45309;
    --badge-app: #7c3aed;
    --shadow: 0 8px 24px rgba(0, 0, 0, .12);
    --link: #1a6fe8;
    --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f1f;
      --bg-soft: #242424;
      --bg-hover: rgba(255, 255, 255, .06);
      --bg-active: rgba(255, 255, 255, .1);
      --fg: rgba(255, 255, 255, .9);
      --fg-dim: rgba(255, 255, 255, .55);
      --fg-mute: rgba(255, 255, 255, .32);
      --line: rgba(255, 255, 255, .14);
      --line-soft: rgba(255, 255, 255, .06);
      --accent: rgba(255, 255, 255, .9);
      --accent-fg: #1a1a1a;
      --me: #2b2b2b;
      --ai: transparent;
      --mark: #6b5a1f;
      --mark-fg: #ffe9a8;
      --badge-web: #6ea0ff;
      --badge-mp: #4ade80;
      --badge-task: #fbbf24;
      --badge-app: #a78bfa;
      --shadow: 0 8px 24px rgba(0, 0, 0, .5);
      --link: #7aa7ff;
    }
  }
  html[data-theme="dark"] {
    --bg: #1f1f1f; --bg-soft: #242424; --bg-hover: rgba(255,255,255,.06); --bg-active: rgba(255,255,255,.1);
    --fg: rgba(255,255,255,.9); --fg-dim: rgba(255,255,255,.55); --fg-mute: rgba(255,255,255,.32);
    --line: rgba(255,255,255,.14); --line-soft: rgba(255,255,255,.06);
    --accent: rgba(255,255,255,.9); --accent-fg: #1a1a1a;
    --me: #2b2b2b; --ai: transparent; --mark: #6b5a1f; --mark-fg: #ffe9a8;
    --badge-web: #6ea0ff; --badge-mp: #4ade80; --badge-task: #fbbf24; --badge-app: #a78bfa;
    --shadow: 0 8px 24px rgba(0,0,0,.5); --link: #7aa7ff;
  }
  html[data-theme="light"] {
    --bg: #ffffff; --bg-soft: #f7f7f8; --bg-hover: rgba(0,0,0,.05); --bg-active: rgba(0,0,0,.08);
    --fg: rgba(0,0,0,.9); --fg-dim: rgba(0,0,0,.55); --fg-mute: rgba(0,0,0,.35);
    --line: rgba(0,0,0,.08); --line-soft: rgba(0,0,0,.05);
    --accent: rgba(0,0,0,.9); --accent-fg: #fff;
    --me: #f4f5f7; --ai: transparent; --mark: #ffe58f; --mark-fg: #000000e6;
    --badge-web: #2f6feb; --badge-mp: #16a34a; --badge-task: #b45309; --badge-app: #7c3aed;
    --shadow: 0 8px 24px rgba(0,0,0,.12); --link: #1a6fe8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* 客户端按钮：26px 高的 ghost 按钮，hover 只变底色不描边 */
  button, .btn {
    font: inherit; font-size: 12px; font-weight: 500; color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: var(--r-md); padding: 3px 9px; height: 26px;
    line-height: 18px; cursor: pointer; text-decoration: none; display: inline-flex;
    align-items: center; gap: 4px; white-space: nowrap; transition: background .12s, border-color .12s, color .12s;
  }
  button:hover, .btn:hover { background: var(--bg-hover); }
  button:active, .btn:active { background: var(--bg-active); }
  button:focus-visible { outline: 2px solid rgba(0, 0, 0, .25); outline-offset: 1px; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary {
    background: var(--accent); color: var(--accent-fg); border-color: transparent;
  }
  button.primary:hover { opacity: .88; background: var(--accent); }
  button.ghost { border-color: transparent; }
  button.ghost:hover { border-color: transparent; }
  input, select {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--bg-soft);
    border: 1px solid transparent; border-radius: var(--r-lg); padding: 6px 10px; outline: none;
    transition: border-color .12s, background .12s;
  }
  input::placeholder { color: var(--fg-mute); }
  input:focus, select:focus { border-color: var(--line); background: var(--bg); }
  .spacer { flex: 1; }
  .mono { font-family: ui-monospace, Consolas, monospace; }

  header {
    padding: 10px 14px 8px; border-bottom: 1px solid var(--line-soft);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  .title-row { display: flex; align-items: center; gap: 6px; }
  h1 { font-size: 14px; font-weight: 600; margin: 0 2px 0 0; white-space: nowrap; letter-spacing: .01em; }
  .meta { color: var(--fg-mute); font-size: 11.5px; white-space: nowrap; }
  .stamp { color: var(--fg-dim); font-size: 11.5px; white-space: nowrap; }
  .stamp.stale { color: #b45309; }
  .search-wrap { position: relative; margin-top: 8px; display: flex; gap: 6px; }
  .search-wrap input { flex: 1; min-width: 0; padding-left: 28px; height: 30px; }
  .search-wrap .ico {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--fg-mute); pointer-events: none; font-size: 12px;
  }
  .search-wrap .scope { height: 30px; padding: 0 6px; background: var(--bg-soft); border-color: transparent; }
  .chips {
    display: flex; flex-wrap: nowrap; gap: 6px; margin-top: 8px; align-items: center;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding-bottom: 1px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips > * { flex: 0 0 auto; }
  .chips select { height: 22px; padding: 0 4px; font-size: 11.5px; background: transparent; border-color: transparent; color: var(--fg-dim); }
  .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: 0 9px; height: 22px;
    display: inline-flex; align-items: center;
    background: transparent; color: var(--fg-dim); font-size: 11.5px; font-weight: 500; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .chip:hover { background: var(--bg-hover); color: var(--fg); }
  .chip[data-on="1"] { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .chip .c { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }

  main { flex: 1; overflow-y: auto; position: relative; }
  .group-h {
    position: sticky; top: 0; z-index: 1; padding: 12px 14px 4px;
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--fg-mute); background: var(--bg);
  }
  .row {
    display: flex; gap: 8px; align-items: flex-start; padding: 7px 12px; margin: 0 4px;
    border-radius: var(--r-lg); cursor: pointer;
  }
  .row:hover { background: var(--bg-hover); }
  /* 行尾「回到会话」直达：一步进原 Session，不用先进详情 */
  .row-go {
    flex: 0 0 auto; align-self: center;
    width: 26px; height: 26px; padding: 0; margin-left: 2px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--fg-mute);
    border-radius: 8px; cursor: pointer;
    opacity: .34; transition: opacity .12s, background .12s, transform .08s;
  }
  .row:hover .row-go { opacity: 1; }
  .row-go:hover { background: var(--bg-active); color: var(--fg); opacity: 1; }
  .row-go:active { transform: scale(.93); }
  @media (hover: none) { .row-go { opacity: .5; } }
  .row.sel { background: var(--bg-active); }
  .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; flex: 0 0 auto; background: var(--fg-mute); }
  .dot[data-o="agents"] { background: var(--badge-web); }
  .dot[data-o="workbuddy-mp"] { background: var(--badge-mp); }
  .dot[data-o="scheduler"] { background: var(--badge-task); }
  .dot[data-o="workbuddy-app"] { background: var(--badge-app); }
  .body { min-width: 0; flex: 1; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 500; }
  .sub { color: var(--fg-mute); font-size: 11px; margin-top: 1px; display: flex; gap: 7px; align-items: center; }
  .badge-n {
    font-size: 10.5px; font-weight: 500; color: var(--fg-dim); background: var(--bg-soft);
    border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: 1px;
    display: inline-block; line-height: 16px;
  }
  .badge-n.busy { color: #b45309; background: #fdf3e3; }
  .badge-n.ok { color: #157f3c; background: #e8f6ee; }
  .badge-n.fail { color: var(--fg-mute); }
  html[data-theme="dark"] .badge-n.busy { background: #3a2e14; color: #f0cf8a; }
  html[data-theme="dark"] .badge-n.ok { background: #16301f; color: #7fe0a2; }
  .fav-star { color: #f0a020; }
  .empty { padding: 40px 16px; text-align: center; color: var(--fg-dim); }
  footer {
    border-top: 1px solid var(--line-soft); padding: 6px 14px;
    color: var(--fg-mute); font-size: 11px; background: var(--bg);
  }
  footer details summary { cursor: pointer; }
  pre {
    margin: 8px 0 0; padding: 8px; border-radius: 6px; background: var(--bg-soft); color: var(--fg);
    font: 11px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap;
    word-break: break-all; max-height: 200px; overflow: auto;
  }
  .toast {
    position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%) translateY(6px);
    background: #111; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px;
    opacity: 0; transition: .18s; pointer-events: none; z-index: 99; max-width: 80%;
  }
  .toast.show { opacity: .94; transform: translateX(-50%) translateY(0); }

  /* ---------- 续聊引导弹层 ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 120; padding: 18px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15, 23, 42, .42);
  }
  .modal[hidden] { display: none; }
  .modal .card {
    width: min(440px, 100%); max-height: 100%; overflow: auto;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); padding: 18px 18px 14px;
  }
  .modal h3 { margin: 0; font-size: 15px; line-height: 1.4; }
  .modal .sub { margin: 6px 0 0; font-size: 12.5px; color: var(--fg-dim); line-height: 1.6; }
  .modal ol { margin: 12px 0 10px; padding-left: 20px; font-size: 12.5px; line-height: 1.95; }
  .modal ol b { color: var(--fg); }
  .modal .tip {
    margin: 0; font-size: 12px; color: var(--fg-dim); line-height: 1.6;
    background: var(--bg-soft); border-radius: 6px; padding: 8px 10px;
  }
  .modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .modal .acts button {
    padding: 6px 13px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg-soft); color: var(--fg);
  }
  .modal .acts button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal .hd { display: flex; align-items: flex-start; gap: 10px; }
  .modal .hd h3 { flex: 1 1 auto; min-width: 0; }
  .modal .x {
    flex: 0 0 auto; width: 26px; height: 26px; padding: 0; margin: -4px -6px 0 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--fg-dim);
    border-radius: 7px; cursor: pointer;
  }
  .modal .x:hover { background: var(--bg-hover); color: var(--fg); }

  /* ---------- 全屏面板 ---------- */
  #detailView, #statsView { display: none; }
  #detailView.on, #statsView.on { display: block; }
  #listView.off { display: none; }
  .bar {
    position: sticky; top: 0; z-index: 4; background: var(--bg);
    display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 8px 10px 7px;
    border-bottom: 1px solid var(--line-soft);
  }
  .brow { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .bar .dt { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .bar .ds { color: var(--fg-mute); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .col { min-width: 0; display: flex; flex-direction: column; flex: 1 1 auto; overflow: hidden; }
  .bar button.icon { width: 26px; padding: 0; justify-content: center; color: var(--fg-dim); border-color: transparent; }
  .bar button.icon:hover { color: var(--fg); }
  .bar button.primary, .bar button.ghost { flex: 0 0 auto; }
  body[data-view="detail"] .search-wrap,
  body[data-view="detail"] .chips,
  body[data-view="stats"] .search-wrap,
  body[data-view="stats"] .chips { display: none; }
  .findbar { display: none; padding: 6px 10px; gap: 6px; align-items: center; border-bottom: 1px solid var(--line-soft); background: var(--bg-soft); }
  .findbar.on { display: flex; }
  .findbar input { flex: 1; min-width: 0; padding: 4px 8px; height: 26px; background: var(--bg); }
  .findbar .cnt { color: var(--fg-mute); font-size: 11px; white-space: nowrap; }

  /* ---------- 消息 ---------- */
  .thread { padding: 12px 14px 40px; }
  .turn { margin: 0 0 13px; }
  .turn .who { font-size: 11px; color: var(--fg-mute); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
  .turn.user { display: flex; flex-direction: column; align-items: flex-end; }
  .turn.user .bubble { background: var(--me); border: none; max-width: 90%; }
  .turn .bubble {
    background: var(--ai); border: 1px solid var(--line-soft); border-radius: 10px;
    padding: 9px 12px; font-size: 12.5px; line-height: 1.7; word-break: break-word;
  }
  .turn .bubble.md > :first-child { margin-top: 0; }
  .turn .bubble.md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 8px; }
  .md h1, .md h2, .md h3, .md h4, .md h5 { margin: 12px 0 6px; line-height: 1.35; }
  .md h1 { font-size: 15px; } .md h2 { font-size: 14.5px; } .md h3 { font-size: 13.5px; } .md h4 { font-size: 13px; }
  .md ul, .md ol { margin: 6px 0 8px; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md code { background: var(--bg-hover); padding: 1px 4px; border-radius: 4px; font: 11.5px ui-monospace, Consolas, monospace; }
  .md pre { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 7px; padding: 9px; overflow: auto; max-height: 380px; margin: 8px 0; }
  .md pre code { background: none; padding: 0; font-size: 11.5px; line-height: 1.5; }
  .md blockquote { margin: 8px 0; padding: 2px 10px; border-left: 3px solid var(--line); color: var(--fg-dim); }
  .md table { border-collapse: collapse; margin: 8px 0; font-size: 12px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; }
  .md a { color: var(--link); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }
  .md img { max-width: 100%; }
  mark { background: var(--mark); color: var(--mark-fg); border-radius: 2px; padding: 0 1px; }
  .turn.flash { animation: flash 1.6s ease; }
  @keyframes flash { 0%,40% { background: var(--bg-active); } 100% { background: transparent; } }

  details.fold { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; }
  details.fold > summary {
    cursor: pointer; padding: 6px 10px; font-size: 11.5px; color: var(--fg-dim);
    display: flex; gap: 6px; align-items: center; list-style: none;
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸"; font-size: 10px; }
  details.fold[open] > summary::before { content: "▾"; }
  details.fold > summary .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  details.fold .inner { padding: 0 10px 8px; }
  .k { font: 10.5px/1.4 ui-monospace, Consolas, monospace; padding: 0 5px; border-radius: 4px; background: var(--bg-hover); color: var(--fg-dim); flex: 0 0 auto; }
  .st-done { color: #16a34a; } .st-run { color: #b45309; } .st-fail { color: #dc2626; }
  .turn.thought .bubble { background: transparent; border-style: dashed; color: var(--fg-dim); font-size: 12px; }

  /* ---------- 搜索命中 ---------- */
  .hit { padding: 8px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .hit:hover { background: var(--bg-hover); }
  .hit .h1 { font-size: 12.5px; }
  .hit .hm { color: var(--fg-dim); font-size: 11.5px; margin-top: 2px; line-height: 1.6; }
  .hit .hm .snip { display: block; margin-top: 2px; }
  .hit .tag { font-size: 10px; color: var(--fg-dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 5px; }

  /* ---------- 统计 ---------- */
  .stats { padding: 14px 16px 40px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .card { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: var(--bg-soft); }
  .card .v { font-size: 18px; font-weight: 600; }
  .card .k2 { color: var(--fg-dim); font-size: 11px; }
  .sec-t { font-size: 12px; font-weight: 600; margin: 14px 0 8px; }
  .barline { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; }
  .barline .lb { width: 72px; color: var(--fg-dim); flex: 0 0 auto; }
  .barline .tr { flex: 1; height: 8px; background: var(--bg-hover); border-radius: 4px; overflow: hidden; }
  .barline .fi { height: 100%; background: var(--accent); border-radius: 4px; }
  .barline .nm { width: 46px; text-align: right; color: var(--fg-dim); flex: 0 0 auto; }
  .days { display: flex; align-items: flex-end; gap: 2px; height: 64px; margin-top: 6px; }
  .days i { flex: 1; background: var(--accent); opacity: .75; border-radius: 2px 2px 0 0; min-height: 1px; }
  .days-x { display: flex; justify-content: space-between; color: var(--fg-dim); font-size: 10px; margin-top: 3px; }

  .state { padding: 26px 16px; text-align: center; color: var(--fg-dim); }
  .state .big { font-size: 13px; color: var(--fg); margin-bottom: 6px; }
  .state .actions { margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* 正文未缓存的落地卡片 */
  .uncached { padding: 22px 16px 8px; }
  .uncached .card2 {
    border: 1px solid var(--line); border-radius: var(--r-xl);
    padding: 16px 16px 14px; background: var(--bg);
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .uncached .ttl { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .uncached .txt { color: var(--fg-dim); font-size: 12.5px; line-height: 1.7; }
  .uncached .kv { margin: 12px 0 0; font-size: 11.5px; color: var(--fg-mute); word-break: break-all; }
  .uncached .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .uncached .acts button { height: 28px; padding: 0 12px; font-size: 12.5px; }
  .uncached .hint { margin-top: 12px; font-size: 11.5px; color: var(--fg-mute); line-height: 1.65; }
  .uncached code { font: 11px ui-monospace, Consolas, monospace; background: var(--bg-soft); padding: 1px 5px; border-radius: 4px; }
  .uncached .acts.wide { display: block; }
  .uncached .acts.wide button { width: 100%; height: 34px; font-size: 13px; font-weight: 500; }
  .uncached .acts.sub { margin-top: 8px; }
  .uncached .acts.sub button { height: 26px; font-size: 12px; color: var(--fg-dim); }

  /* 快照说明条：明确「这里不是最新」，避免误以为面板能看全 */
  .snap {
    display: flex; align-items: baseline; gap: 4px;
    margin: 10px 12px 2px; padding: 6px 9px;
    font-size: 11.5px; line-height: 1.5; color: var(--fg-dim);
    background: var(--bg-soft); border-radius: 8px;
  }

<script>
/* ------------------------------------------------------------------
 * 宿主 Guest 通道（必须尽早就位）
 *
 * 桌面端把扩展挂在 iframe 里，加载完成后会向 iframe postMessage：
 *   { type: "__wb_port_init__", readyToken } + MessagePort(port2)
 * guest 必须在 10s 内通过这个 port 回一条
 *   { type:"wb:invoke:request", channel:"wb:boundary:guest-ready",
 *     args:[{ readyToken }] }
 * 否则宿主判定握手失败，界面就显示「插件加载失败 / 请检查网络后重新加载」
 * （日志里是 "Guest Ready timed out after 10000ms: <extensionId>"）。
 * 同时宿主的 wb:* 能力（openExternal / message:fill / http:get ...）
 * 也只能走这条 MessagePort，window.parent.postMessage 那条老路宿主不再监听。
 * 所以这段放在 <head> 里、页面前，抢在超时之前完成握手。
 * ------------------------------------------------------------------ */
(function () {
  "use strict";
  var G = {
    port: null, token: "", ready: false, via: "", seq: 0,
    pending: {}, events: {}, lines: []
  };
  window.__WBCS_GUEST__ = G;

  function note(s) {
    try { G.lines.push(s); if (G.lines.length > 30) G.lines.shift(); } catch (e) {}
  }
  G.note = note;

  function send(msg) {
    try { G.port.postMessage(msg); return true; }
    catch (e) { note("port 发送失败: " + (e && e.message)); return false; }
  }

  function settle(d) {
    var p = G.pending[d.requestId];
    if (!p) return;
    delete G.pending[d.requestId];
    if (p.timer) clearTimeout(p.timer);
    if (d.error) {
      var err = new Error((d.error && d.error.message) || "宿主调用失败");
      err.code = d.error && d.error.code;
      p.reject(err);
    } else {
      p.resolve(d.result);
    }
  }

  function onPortMessage(ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== "object" || typeof d.type !== "string") return;
    if (d.type === "wb:invoke:response") { settle(d); return; }
    if (d.type === "wb:event") {
      var list = G.events[d.event] || [];
      for (var i = 0; i < list.length; i++) {
        try { list[i](d.payload); } catch (e) {}
      }
      return;
    }
    if (d.type === "wb:invoke:request") {
      send({
        type: "wb:invoke:response",
        requestId: d.requestId,
        error: { message: "本扩展没有对外暴露方法: " + d.channel, code: "WB_GUEST_CHANNEL_NOT_FOUND" }
      });
    }
  }

  G.on = function (name, fn) {
    (G.events[name] = G.events[name] || []).push(fn);
  };

  G.invoke = function (channel, args, timeout) {
    return new Promise(function (resolve, reject) {
      if (!G.port) { reject(new Error("宿主通道未建立")); return; }
      var id = "g-" + (++G.seq);
      var timer = setTimeout(function () {
        delete G.pending[id];
        reject(new Error("宿主调用超时：" + channel));
      }, timeout || 20000);
      G.pending[id] = { resolve: resolve, reject: reject, timer: timer };
      if (!send({ type: "wb:invoke:request", requestId: id, channel: channel, args: args || [] })) {
        clearTimeout(timer); delete G.pending[id];
        reject(new Error("无法发送宿主调用：" + channel));
      }
    });
  };

  /* 把 ready 当成一次普通 invoke 发出去；宿主把该 channel 注册成 ready gate */
  function hello(token) {
    var id = "ready-" + (++G.seq);
    G.pending[id] = {
      timer: 0,
      resolve: function () { G.ready = true; note("guest-ready 已确认"); },
      reject: function (e) { note("guest-ready 被拒: " + e.message); }
    };
    var payload = token ? { readyToken: token } : {};
    if (!send({ type: "wb:invoke:request", requestId: id, channel: "wb:boundary:guest-ready", args: [payload] })) {
      delete G.pending[id];
      note("guest-ready 发送失败");
    }
  }

  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || typeof d !== "object") return;

    if (d.type === "__wb_port_init__") {
      if (G.port) return;
      var port = ev.ports && ev.ports[0];
      if (!port) { note("port init 里没有 MessagePort"); return; }
      G.port = port;
      G.token = d.readyToken || "";
      G.via = "port";
      port.addEventListener("message", onPortMessage);
      try { port.start(); } catch (e) {}
      hello(G.token);
      return;
    }

    /* 兼容：万一宿主走的是老的 window-message 桥 */
    if (d.type === "wb:handshake:response" || d.type === "wb:invoke:response") settle(d);
  }, false);

  note("guest 已就位，等待宿主 port");
})();
</script>

(function () {

  // 与 extension.json / distribution.json 保持一致；build 时会校验
  var PAGE_VERSION = "1.11.2";

  var DATA = window.CLOUD_SESSIONS || {
    items: [], total: 0, counts: {}, originLabels: {}, originOrder: [],
    generatedAt: "?", generatedAtMs: 0, webOrigin: "https://www.workbuddy.cn"
  };
  var WEB = DATA.webOrigin || "https://www.workbuddy.cn";
  var ORDER = DATA.originOrder && DATA.originOrder.length ? DATA.originOrder
    : ["agents", "workbuddy-mp", "workbuddy-app", "scheduler", "workbuddy-deploy", "genie"];
  var ROLE_NAME = { u: "我", a: "助手", h: "思考", t: "工具" };

  var SESSIONS = {};      // id -> shard
  var INDEX = {};         // id -> {n, ok}
  var SEARCH = null;      // [[id, [[idx, role, snippet], ...]], ...]
  var SEARCH_BY_ID = null;
  /* 云端直连拉回来的正文不进 _search.js（那是 build 时生成的静态文件），
     所以在内存里补一份同格式的索引，否则「搜得到」和「看得到」会对不上。 */
  var CLOUD_IDX = {};
  var FAV = loadFav();

  var state = {
    q: "",
    scope: "title",
    origin: {},
    sort: "recent",
    view: "list",   // list | search | detail | stats
    current: null,
    hits: [],       // 会话内查找命中节点
    hitIdx: -1
  };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function relTime(ms) {
    if (!ms) return null;
    var d = new Date(ms);
    var abs = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());

        var d = unwrap(res) || {};
        var list = d.conversations || [];
        collected = collected.concat(list);
        var pgn = d.pagination || {};
        if (pgn.hasNext && p < (pgn.totalPages || 1) && p < 10) return page(p + 1);
        return collected;
      });
    }

    page(1).then(function (list) {
      if (!list.length) throw new Error("接口返回 0 条会话");
      var index = {};
      DATA.items.forEach(function (it) { index[it.id] = it; });
      var fresh = [];
      list.forEach(function (c) {
        var id = String(c.id);
        var o = originOf(c);
        if (index[id]) {
          if (c.name) index[id].title = c.name;
          return;
        }
        var it = {
          id: id,
          title: c.name || "(无标题)",
          origin: o,
          originLabel: DATA.originLabels[o] || o,
          ts: tsOf(c),
          created: tsOf(c),
          status: c.status || "",
          n: 0,
          t: 0,
          ok: false,
          live: true,
          pull: ""        // '' | busy | ok | fail
        };
        DATA.items.push(it);
        index[id] = it;
        fresh.push(it);
      });
      recount();
      markSynced(Date.now());
      render();
      log("sync/ok", list.length + " 条，新增 " + fresh.length + (auto ? "（自动）" : ""));
      lb.textContent = old;
      btn.disabled = false;
      syncing = false;

      if (!fresh.length) {
        // 自动同步时不打扰：只有确实有新会话才提示
        if (!auto) toast("已同步 " + list.length + " 条会话，没有新的");
        prefetchRecent();
        return;
      }
      toast("已同步，新增 " + fresh.length + " 条，正在拉正文…", 2600);
      pullBodies(fresh);
      prefetchRecent();
    }).catch(function (e) {
      log("sync/failed", e.message + (e.code ? " [" + e.code + "]" : "") + (auto ? "（自动）" : ""));
      if (!auto) toast("同步失败：" + e.message + "（宿主可能未放行网络通道）");
      lb.textContent = old;
      btn.disabled = false;
      syncing = false;
      if (auto) lastAutoSync = 0;   // 通道还没就绪，别把节流额度用掉
    });
  }

  /* -------- 后台补正文：service 直连云端，串行跑，列表里带进度 -------- */
  var fillJob = null;

  function jobBar(text, onStop) {
    var host = document.getElementById("jobHost");
    if (!host) return null;
    var bar = el("div", "jobbar");
    bar.appendChild(el("div", "spin"));
    var t = el("div", "jt", text);
    bar.appendChild(t);
    var btn = el("button", null, "停止");
    btn.onclick = onStop;
    bar.appendChild(btn);
    host.appendChild(bar);
    return { bar: bar, txt: t, btn: btn };
  }

  /**
   * @param {object[]} list  要补的会话
   * @param {{label?:string, force?:boolean, max?:number}} opts
   */
  function startFill(list, opts) {
    opts = opts || {};
    if (fillJob) { toast("已经在补了"); return fillJob.promise; }
    var queue = list.slice(0, opts.max || 999);
    if (!queue.length) { toast("没有要补的会话"); return Promise.resolve(0); }

    var job = { done: 0, total: queue.length, stop: false };
    fillJob = job;
    var ui = jobBar((opts.label || "从云端补正文") + " 0/" + job.total, function () {
      job.stop = true;
      if (ui) ui.txt.textContent = "正在停止…";
    });
    log("fill/start", job.total + " 条");

    return new Promise(function (resolve) {
      function finish(reason) {
        if (ui && ui.bar) ui.bar.remove();
        fillJob = null;
        log("fill/end", (reason || "done") + " " + job.done + "/" + job.total);
        render();
        resolve(job.done);
      }
      function step() {
        if (job.stop) return finish("stopped");
        var it = queue.shift();
        if (!it) return finish("done");
        SB.fetchBody(it.id, opts.force ? { force: true } : null).then(function (r) {
          var shard = r.shard || r;
          shard.id = it.id;
          acceptShard(it, shard, "cloud");
        }).catch(function (e) {
          log("fill/fail", it.id + " " + e.message + (e.code ? " [" + e.code + "]" : ""));
          if (/service 不可用|PERMISSION|NO_GRANT/.test(String(e.message))) job.stop = true;
        }).then(function () {
          job.done++;
          if (ui) {
            ui.txt.textContent = (opts.label || "从云端补正文") + " " + job.done + "/" + job.total;
          }
          if (state.view === "list" || state.view === "search") render();
          setTimeout(step, 80);
        });
      }
      step();
    });
  }

  /** 进面板先补最近几条没正文的，点进去就不会是空壳 */
  var prefetched = {};
  /* 拉不动的（纯定时任务会话、云端没正文）记一笔，24 小时内别再试，
     否则每次进面板都要为同几条白跑一遍。 */
  var PULL_FAIL = {};
  try { PULL_FAIL = JSON.parse(localStorage.getItem("wbcs.pullFail") || "{}") || {}; } catch (e) {}
  var FAIL_TTL = 24 * 3600 * 1000;
  function markPullFail(id) {
    PULL_FAIL[id] = Date.now();
    var cut = Date.now() - FAIL_TTL;
    Object.keys(PULL_FAIL).forEach(function (k) { if (!(PULL_FAIL[k] > cut)) delete PULL_FAIL[k]; });
    try { localStorage.setItem("wbcs.pullFail", JSON.stringify(PULL_FAIL)); } catch (e) {}
  }
  function prefetchRecent() {
    if (SB.state() !== "ok" || fillJob) return;
    var cut = Date.now() - FAIL_TTL;
    var cand = DATA.items
      .filter(function (it) {
        return !(it.n > 0) && !prefetched[it.id] && !(PULL_FAIL[it.id] > cut);
      })
      .sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); })
      .slice(0, 5);
    if (!cand.length) return;
    cand.forEach(function (it) { prefetched[it.id] = 1; });
    startFill(cand, { label: "预取最近会话" }).then(function () {
      cand.forEach(function (it) { if (!(it.n > 0)) markPullFail(it.id); });
    });
  }

  /* 鼠标停在某一行上就开始拉那条 —— 真点进去时通常已经在缓存里，
   * 体感从「等 1.5 秒」变成「直接有」。最多 2 条并行，避免扫一遍列表把网关打满。 */
  var hoverTimer = null;
  var hoverBusy = 0;
  function prefetchOnHover(it) {
    if (SB.state() !== "ok" || fillJob || hoverBusy >= 2) return;
    var cut = Date.now() - FAIL_TTL;
    if (it.n > 0 || SESSIONS[it.id] || prefetched[it.id] || PULL_FAIL[it.id] > cut) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(function () {
      hoverBusy++;
      prefetched[it.id] = 1;
      SB.fetchBody(it.id, it.ts ? { ts: it.ts } : null).then(function (r) {
        var shard = r.shard || r;
        shard.id = it.id;
        acceptShard(it, shard, "cloud");
        if (state.view === "list" || state.view === "search") render();
      }).catch(function (e) {
        markPullFail(it.id);
        log("prefetch/fail", it.id + " " + e.message);
      }).then(function () { hoverBusy--; });
    }, 150);
  }

  /* 自动同步：进面板 / 重新可见 / 窗口获得焦点时拉一次列表，60 秒内不重复。
   * 宿主是 keepAlive 的，iframe 不会重新加载，所以要靠可见性变化判断「又点进来了」。 */
  var lastAutoSync = 0;
  function autoSync(reason) {
    if (syncing) return;
    if (state.view === "detail" || state.view === "stats") return;
    if (Date.now() - lastAutoSync < 60000) return;
    lastAutoSync = Date.now();
    log("autosync", reason);
    syncLive({ auto: true });
  }

  /* ================= 拉正文（在线，逐条） =================
   * 三条通道按成功率依次尝试：
   *   1) wb:conversations:get —— 客户端自己的会话服务，本地/云端都会走它加载
   *   2) ACP：/session 换 link+token（宿主 http 通道带 cookie），再在页面里直连 SSE
   *   3) 都不行 → 详情页给「网页版 / 回到会话」兜底
   * 每一步的返回结构都会打到诊断区，失败原因一眼能看到。
   */
  /* 宿主 __wbInvoke(channel, second, ...rest) 里，second 会被当成 subject 提示剥掉，
     真正的 payload 从第三个参数开始；但老版本是 (channel, args)。两种都试，
     谁先给出正常结果就记住谁（存 localStorage，下次直接用）。 */
  var WB_STYLE = null;
  try { WB_STYLE = localStorage.getItem("wbcs.wbStyle") || null; } catch (e) {}
  var WB_DEAD = false; // 三种形态全废 → 本次会话不再尝试，直接走 ACP

  function withTimeout(p, ms, label) {
    return Promise.race([p, new Promise(function (_, rej) {
      setTimeout(function () { rej(new Error("超时 " + label)); }, ms);
    })]);
  }

  function wbRaw(style, channel, args) {
    var fn = window.__wbInvoke;
    if (typeof fn !== "function") return Promise.reject(new Error("__wbInvoke 不可用"));
    if (style === "rest") return fn.apply(null, [channel, null].concat(args));
    if (style === "flat") return fn.apply(null, [channel].concat(args));
    return fn(channel, args);
  }

  function looksOk(v) {
    if (!v || typeof v !== "object") return false;
    if (v.__wbError) return false;
    if (Object.keys(v).length <= 2 && (v.code || v.message)) return false;
    return true;
  }

  function wbCall(channel, args, timeout) {
    args = args || [];
    timeout = timeout || 8000;
    if (WB_STYLE) return withTimeout(Promise.resolve(wbRaw(WB_STYLE, channel, args)), timeout, channel);
    var styles = ["rest", "flat", "arg2"];
    return new Promise(function (resolve, reject) {
      var left = styles.length, errs = [];
      styles.forEach(function (st) {
        var p;
        try { p = Promise.resolve(wbRaw(st, channel, args)); } catch (e) { p = Promise.reject(e); }
        withTimeout(p, timeout, channel + "/" + st).then(function (v) {
          if (looksOk(v)) {
            if (!WB_STYLE) {
              WB_STYLE = st;
              try { localStorage.setItem("wbcs.wbStyle", st); } catch (e) {}
              log("wb/style", "选定 " + st + "（" + channel + "）");
            }
            resolve(v);
            return;
          }
          errs.push(st + ":" + (v && v.__wbError ? (v.code || v.message || "报错") : "空结果"));
          if (--left === 0) reject(new Error(errs.join(" | ")));
        }, function (e) {
          errs.push(st + ":" + e.message);
          if (--left === 0) reject(new Error(errs.join(" | ")));
        });
      });
    });
  }

  /** wb:conversations:requests 的一页 → shard */
  function requestsToShard(page, id) {
    var items = page && (page.items || page.requests);
    if (!Array.isArray(items) || !items.length) return null;
    var msgs = [], stats = { total: 0, user: 0, assistant: 0, thought: 0, tool: 0 };
    function push(m, k) { msgs.push(m); stats.total++; if (k) stats[k] = (stats[k] || 0) + 1; }
    items.forEach(function (r) {
      if (!r || typeof r !== "object") return;
      var ut = textOfNode(r.userMessage && r.userMessage.content);
      if (ut) push({ r: "user", t: String(ut).slice(0, 24000), k: "", n: "", s: "", i: "", o: "" }, "user");
      var at = textOfNode(r.assistantMessage && r.assistantMessage.content);
      if (at) push({ r: "assistant", t: String(at).slice(0, 24000), k: "", n: "", s: "", i: "", o: "" }, "assistant");
    });
    if (!msgs.length) return null;
    return { id: id, ok: true, title: null, stats: stats, messages: msgs, fetchedAt: Date.now(), live: true };
  }

  function shapeOf(v) {
    if (v == null) return String(v);
    if (Array.isArray(v)) return "array(" + v.length + ")";
    if (typeof v === "object") return "{" + Object.keys(v).slice(0, 14).join(",") + "}";
    return typeof v;
  }

  function textOfNode(c) {
    if (c == null) return "";
    if (typeof c === "string") return c;
    if (Array.isArray(c)) return c.map(textOfNode).filter(Boolean).join("\n");
    if (typeof c === "object") {
      if (typeof c.text === "string") return c.text;
      if (typeof c.content === "string") return c.content;
      if (Array.isArray(c.content)) return textOfNode(c.content);
      if (c.content && typeof c.content === "object") return textOfNode(c.content);
      if (c.type === "image") return "[图片]";
      return "";
    }
    return "";
  }

  /** 客户端 conversation 对象 → 我们的 shard 结构（尽量宽容，认不出就返回 null） */
  function convToShard(conv, id) {
    if (!conv || typeof conv !== "object") return null;
    var reqs = conv.requests || conv.turns || conv.messages || (conv.data && conv.data.requests);
    if (!Array.isArray(reqs) || !reqs.length) return null;

    var msgs = [], stats = { total: 0, user: 0, assistant: 0, thought: 0, tool: 0 };
    function push(m) { msgs.push(m); stats.total++; }

    reqs.forEach(function (r) {
      if (!r || typeof r !== "object") return;
      var um = r.userMessage || r.prompt || r.input;
      var ut = textOfNode(um && (um.content != null ? um.content : um));
      if (ut) { push({ r: "user", t: ut, k: "", n: "", s: "", i: "", o: "" }); stats.user++; }

      var parts = r.parts || r.items || r.blocks || (r.response && (r.response.parts || r.response.items || r.response.content)) || null;
      var texts = [];
      (function walk(node, depth) {
        if (!node || depth > 4) return;
        if (Array.isArray(node)) { node.forEach(function (x) { walk(x, depth + 1); }); return; }
        if (typeof node !== "object") return;
        var role = node.role || node.type;
        var t = textOfNode(node.content != null ? node.content : (node.text != null ? node.text : null));
        if (t && (role === "assistant" || role === "agent" || role === "text" || role === "response")) {
          texts.push({ role: role, t: t });
          return;
        }
        if (node.toolName || node.toolCallId) {
          texts.push({ role: "tool", t: "" , name: node.toolName || node.title || node.name || "工具",
            input: node.input || node.rawInput || node.args, status: node.status || "", output: textOfNode(node.output || node.result) });
          return;
        }
        Object.keys(node).forEach(function (k) { walk(node[k], depth + 1); });
      })(parts, 0);

      texts.forEach(function (x) {
        if (x.role === "tool") {
          push({
            r: "tool", t: "", k: "tool", n: x.name || "工具", s: x.status || "",
            i: x.input ? String(JSON.stringify(x.input, null, 1)).slice(0, 4000) : "",
            o: x.output ? String(x.output).slice(0, 8000) : ""
          });
          stats.tool++;
        } else {
          push({ r: "assistant", t: x.t.slice(0, 24000), k: "", n: "", s: "", i: "", o: "" });
          stats.assistant++;
        }
      });
    });

    if (!msgs.length) return null;
    var info = conv.info || {};
    return {
      id: id,
      ok: true,
      title: info.title || info.name || null,
      stats: stats,
      messages: msgs,
      fetchedAt: Date.now(),
      live: true
    };
  }

  /* 拉正文：先走客户端自己的会话数据源（和「回到会话」同一条路，快、准），
     wb 通道整条废掉时才退回 ACP 直连。 */
  function pullOne(it) {
    it.pull = "busy";
    render();

    /* ① 云端直连（扩展内 service）：最新也最全，成功就不用再兜底 */
    var viaCloud = (SB.state() === "ok"
      ? SB.fetchBody(it.id)
      : Promise.reject(new Error("service 不可用"))
    ).then(function (r) {
      var shard = r.shard || r;
      shard.id = it.id;
      acceptShard(it, shard, "cloud");
      return true;
    });

    /* ② 本机 daemon 的 requests（只有 local 会话有真数据） */
    function viaLocal() {
      return WB_DEAD
        ? Promise.reject(new Error("wb 通道本次已判定不可用"))
        : wbCall("wb:conversations:requests", [it.id], 9000).then(function (page) {
            log("requests", "ok " + shapeOf(page));
            var shard = requestsToShard(page, it.id);
            if (!shard) throw new Error("requests 里没有可解析的消息");
            acceptShard(it, shard);
            return true;
          }).catch(function (e) {
            if (/超时|不可用|PERMISSION|NOT_FOUND|denied/i.test(e.message)) WB_DEAD = true;
            throw e;
          });
    }

    return viaCloud.catch(function (e) {
      if (SB.state() !== "off") log("cloud", "fail " + e.message);
      return viaLocal().catch(function (e2) {
        log("requests", "fail " + e2.message);
        return pullViaAcp(it).catch(function (e3) {
          log("acp", "fail " + (e3.code ? "[" + e3.code + "] " : "") + e3.message);
          it.pull = "fail";
          return false;
        });
      });
    });
  }

  function acceptShard(it, shard, source) {
    it.pull = "ok";
    it.ok = true;
    it.n = (shard.messages || []).length;
    it.t = (shard.stats && shard.stats.tool) || 0;
    it.cloud = source === "cloud";
    if (source === "cloud") it.liveAt = shard.fetchedAt || Date.now();
    /* 记住这份正文是哪来的：预取也是走云端，等会儿点进详情别又当成「本机快照」，
     * 否则会误弹「快照可能不是最新」的提醒（而且内容明明是刚拉的）。 */
    shard.src = source || "local";
    SESSIONS[it.id] = shard;
    INDEX[it.id] = { n: it.n, ok: true };
    if (shard.title && shard.title !== it.title) it.title = shard.title;
    if (source === "cloud") indexCloud(it.id, shard);
  }

  /** 给云端正文建一份搜索索引（格式同 build.js 的 _search.js，只收正文类消息） */
  function indexCloud(id, shard) {
    var entries = [];
    (shard.messages || []).forEach(function (m, idx) {
      var r = m[0] || "a";
      if (r === "t") return;
      var text = String(m[1] || "").replace(/\s+/g, " ").slice(0, 200);
      if (text.length < 2) return;
      entries.push([idx, r, text]);
    });
    if (!entries.length) return;
    CLOUD_IDX[id] = entries;
    if (SEARCH_BY_ID) SEARCH_BY_ID[id] = entries;
  }

  /** ACP 直连：app 页面内 fetch 长连接（CORS 可能被挡，失败就是失败） */
  function pullViaAcp(it) {
    return httpGet(WEB + "/console/as/conversations/" + encodeURIComponent(it.id) + "/session").then(function (res) {
      var d = unwrap(res) || {};
      if (!d.link || !d.token) throw new Error("没有拿到 link/token");
      var link = String(d.link).replace(/^http:\/\//, "https://");
      log("acp/link", link.replace(/\?.*$/, ""));
      return ssrFetch(link, d.token, d.sessionId || it.id, 4000).then(function (events) {
        var shard = eventsToShard(events, it.id);
        if (!shard) throw new Error("SSE 里没有可解析的事件");
        acceptShard(it, shard);
        return true;
      });
    });
  }

  function ssrFetch(link, token, sid, idleMs) {
    return new Promise(function (resolve, reject) {
      var events = [], buf = "", connId = "", done = false, idle = 0, ctrl = new AbortController();
      function finish(err) {
        if (done) return;
        done = true;
        clearTimeout(idle);
        try { ctrl.abort(); } catch (e) {}
        if (err && !events.length) reject(err); else resolve(events);
      }
      function bump() {
        clearTimeout(idle);
        idle = setTimeout(function () { finish(null); }, idleMs || 5000);
      }
      fetch(link, {
        method: "GET",
        headers: { accept: "text/event-stream", authorization: "Bearer " + token },
        cache: "no-store",
        signal: ctrl.signal
      }).then(function (res) {
        if (!res.ok) { finish(new Error("SSE HTTP " + res.status)); return; }
        connId = res.headers.get("acp-connection-id") || "";
        log("acp/sse", "open conn=" + (connId ? "yes" : "no"));
        bump();
        var reader = res.body.getReader();
        var dec = new TextDecoder();
        (function pump() {
          reader.read().then(function (r) {
            if (r.done) { finish(null); return; }
            buf += dec.decode(r.value, { stream: true });
            var i;
            while ((i = buf.indexOf("\n")) >= 0) {
              var line = buf.slice(0, i).trim();
              buf = buf.slice(i + 1);
              if (!line) continue;
              if (line.indexOf("data:") === 0) line = line.slice(5).trim();
              if (!line || line === "[DONE]") continue;
              try { events.push(JSON.parse(line)); bump(); } catch (e) {}
            }
            pump();
          }).catch(function (e) { finish(e); });
        })();

        // 建连后立刻 initialize + session/load
        var hdr = { "content-type": "application/json", accept: "application/json, text/event-stream", authorization: "Bearer " + token };
        if (connId) hdr["acp-connection-id"] = connId;
        setTimeout(function () {
          fetch(link, { method: "POST", headers: hdr, body: JSON.stringify({
            jsonrpc: "2.0", id: 0, method: "initialize",
            params: { protocolVersion: 1, clientCapabilities: { fs: { readTextFile: false, writeTextFile: false } } }
          }) }).catch(function () {});
          setTimeout(function () {
            fetch(link, { method: "POST", headers: hdr, body: JSON.stringify({
              jsonrpc: "2.0", id: 1, method: "session/load",
              params: { sessionId: sid, cwd: "/workspace", mcpServers: [] }
            }) }).catch(function () {});
          }, 300);
        }, 400);
      }).catch(function (e) {
        finish(new Error("SSE 建连失败：" + (e && e.message)));
      });
      setTimeout(function () { finish(new Error("SSE 超时")); }, 12000);
    });
  }

  /** 事件 → shard（与 src/parse.js 同规则） */
  function eventsToShard(events, id) {
    var messages = [], tools = {}, title = null, lastText = null;
    var stats = { total: 0, user: 0, assistant: 0, thought: 0, tool: 0 };
    function clip(s, n) { s = String(s == null ? "" : s); return s.length > n ? s.slice(0, n) + "\n…(已截断)" : s; }
    events.forEach(function (ev) {
      if (!ev || typeof ev !== "object") return;
      if (ev.method && ev.method !== "session/update") return;
      var up = (ev.params || {}).update;
      if (!up) return;
      var type = up.sessionUpdate;
      if (type === "user_message_chunk" || type === "agent_message_chunk" || type === "agent_thought_chunk") {
        var role = type === "user_message_chunk" ? "user" : type === "agent_thought_chunk" ? "thought" : "assistant";
        var text = textOfNode(up.content);
        if (!text) return;
        var mid = up.messageId || up.uuid || "";
        if (lastText && lastText.r === role && mid && lastText.mid === mid) lastText.t += text;
        else {
          lastText = { r: role, t: text, mid: mid, k: "", n: "", s: "", i: "", o: "" };
          messages.push(lastText);
          stats[role] = (stats[role] || 0) + 1;
        }
        return;
      }
      if (type === "tool_call") {
        var tid = up.toolCallId || up.uuid || "tool-" + messages.length;
        var item = {
          r: "tool", t: "", k: up.kind || "tool", n: up.title || "", s: up.status || "",
          i: clip(up.rawInput ? JSON.stringify(up.rawInput, null, 1) : textOfNode(up.content), 4000), o: ""
        };
        tools[tid] = item; messages.push(item); stats.tool++; lastText = null;
        return;
      }
      if (type === "tool_call_update") {
        var t2 = tools[up.toolCallId];
        if (!t2) return;
        if (up.status) t2.s = up.status;
        if (up.title) t2.n = up.title;
        var out = textOfNode(up.content) || (up.rawOutput ? JSON.stringify(up.rawOutput) : "");
        if (out) t2.o = clip(out, 8000);
        return;
      }
      if (type === "session_info_update" && up.title) title = up.title;
    });
    messages.forEach(function (m) { if (m.t && m.t.length > 24000) m.t = clip(m.t, 24000); });
    if (!messages.length) return null;
    stats.total = messages.length;
    return { id: id, ok: true, title: title, stats: stats, messages: messages, fetchedAt: Date.now(), live: true };
  }

  /**
   * 后台补快照。
   * cloud 会话的正文只在本机留片段，全量拉既慢又大多失败，
   * 所以只补最近 30 条、并发 2、失败不打扰（列表已标「云端」）。
   */
  function pullBodies(list) {
    var queue = list.slice(0, 30);
    var ok = 0, fail = 0, running = 0;
    function worker() {
      var it = queue.shift();
      if (!it) {
        if (!running) {
          log("pull/done", "ok " + ok + " / fail " + fail);
          if (ok) toast("已补 " + ok + " 条快照", 1800);
          render();
        }
        return;
      }
      running++;
      pullOne(it).then(function (good) {
        if (good) ok++; else fail++;
        running--;
        render();
        worker();
      });
    }
    render();
    for (var i = 0; i < 2; i++) worker();
  }

  /* ================= 分片加载 ================= */
  var fullWait = {}, fullFail = {};
  window.__WBCS_SESSION__ = function (data) {
    if (!data || !data.id) return;
    SESSIONS[data.id] = data;
    var q = fullWait[data.id] || [];
    fullWait[data.id] = [];
    q.forEach(function (cb) { cb(null, data); });
  };
  function loadSession(id, cb) {
    if (SESSIONS[id]) return cb(null, SESSIONS[id]);
    if (fullFail[id]) return cb(new Error("no-shard"));
    if (fullWait[id]) { fullWait[id].push(cb); return; }
    fullWait[id] = [cb];
    var s = document.createElement("script");
    s.src = "./full/" + encodeURIComponent(id) + ".js";
    s.onload = function () {
      setTimeout(function () {
        if (SESSIONS[id]) { var q = fullWait[id] || []; fullWait[id] = []; q.forEach(function (f) { f(null, SESSIONS[id]); }); }
        else {
          fullFail[id] = true;
          var q2 = fullWait[id] || []; fullWait[id] = [];
          q2.forEach(function (f) { f(new Error("empty-shard")); });
        }
      }, 20);
    };
    s.onerror = function () {
      fullFail[id] = true;
      var q = fullWait[id] || []; fullWait[id] = [];
      q.forEach(function (f) { f(new Error("no-shard")); });
    };
    document.head.appendChild(s);
  }

  /* ================= Markdown ================= */
  function inlineMd(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]{1,120})\]\((https?:\/\/[^)\s]{1,400})\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function mdToHtml(src) {
    var lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
    var out = [], para = [], list = null, i = 0;
    function flushPara() {
      if (para.length) { out.push("<p>" + para.map(inlineMd).join("<br>") + "</p>"); para = []; }
    }
    function flushList() { if (list) { out.push("</" + list + ">"); list = null; } }
    function flushAll() { flushPara(); flushList(); }

    while (i < lines.length) {
      var line = lines[i];
      var m = /^\s*```(.*)$/.exec(line);
      if (m) {
        flushAll();
        var code = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
        continue;
      }
      if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1]) && /-/.test(lines[i + 1])) {
        flushAll();
        var head = line.split("|").map(function (c) { return c.trim(); });
        if (head[0] === "") head.shift();
        if (head[head.length - 1] === "") head.pop();
        i += 2;
        var rows = [];
        while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim()) {
          var r = lines[i].split("|").map(function (c) { return c.trim(); });
          if (r[0] === "") r.shift();
          if (r[r.length - 1] === "") r.pop();
          rows.push(r); i++;
        }
        var t = "<table><thead><tr>" + head.map(function (c) { return "<th>" + inlineMd(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
        rows.forEach(function (r2) {
          t += "<tr>" + head.map(function (_, k) { return "<td>" + inlineMd(r2[k] || "") + "</td>"; }).join("") + "</tr>";
        });
        out.push(t + "</tbody></table>");
        continue;
      }
      var h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) { flushAll(); var lv = Math.min(h[1].length + 1, 6); out.push("<h" + lv + ">" + inlineMd(h[2]) + "</h" + lv + ">"); i++; continue; }
      if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flushAll(); out.push("<hr>"); i++; continue; }
      if (/^\s*>\s?/.test(line)) {
        flushAll();
        var ql = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) { ql.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
        out.push("<blockquote>" + ql.map(inlineMd).join("<br>") + "</blockquote>");
        continue;
      }
      var ul = /^\s*[-*+]\s+(.*)$/.exec(line);
      var ol = /^\s*\d+[.)]\s+(.*)$/.exec(line);
      if (ul || ol) {
        flushPara();
        var want = ul ? "ul" : "ol";
        if (list !== want) { flushList(); out.push("<" + want + ">"); list = want; }
        out.push("<li>" + inlineMd((ul || ol)[1]) + "</li>");
        i++; continue;
      }
      if (!line.trim()) { flushAll(); i++; continue; }
      flushList();
      para.push(line);
      i++;
    }
    flushAll();
    return out.join("");
  }

  /* ================= 消息渲染 ================= */
  function statusCls(s) {
    s = String(s || "").toLowerCase();
    if (/complet|success|done/.test(s)) return "done";
    if (/fail|error|cancel/.test(s)) return "fail";
    return "run";
  }

  /**
   * 正文拿不到时的落地卡。
   * cloud 会话的消息存在云端，客户端只有自己打开会话时才回放，面板读不到。
   * 所以这里不做「重试阅读器」，只做一件事：把人送回去。
   */
  function uncachedCard(it, id) {
    var cloudReady = SB.state() === "ok";
    var box = el("div", "uncached");
    var card = el("div", "card2");
    card.appendChild(el("div", "ttl", cloudReady ? "这次没拉到正文" : "完整内容在客户端"));

    var txt = el("div", "txt");
    txt.textContent = cloudReady
      ? "云端直连这次没成功（可能是网络或网关超时）。再试一次通常就好；实在不行回原会话看，那边一定是全的。"
      : "这条会话的消息存在云端，面板只能读到本机已缓存的片段。" +
        "点下面的按钮会直接打开同一个 Session，历史和后续对话都是最新的。";
    card.appendChild(txt);

    var t = relTime(it.ts);
    var kv = el("div", "kv");
    kv.textContent = (t ? t.abs + " · " : "") + label(it.origin);
    card.appendChild(kv);

    var acts = el("div", "acts wide");
    var primary = el("button", "primary", cloudReady ? "重试云端读取" : "回到会话");
    primary.onclick = function () {
      if (!cloudReady) { openSessionInClient(id); return; }
      primary.disabled = true;
      primary.textContent = "读取中…";
      SB.fetchBody(id, { force: true }).then(function (r) {
        var shard = r.shard || r;
        shard.id = id;
        acceptShard(it, shard, "cloud");
        toast("已拉到 " + (shard.messages || []).length + " 条");
        openDetail(id);
      }).catch(function (e) {
        primary.disabled = false;
        primary.textContent = "重试云端读取";
        toast("还是不行：" + e.message);
      });
    };
    acts.appendChild(primary);
    card.appendChild(acts);

    var subs = el("div", "acts sub");

    if (cloudReady) {
      var back = el("button", null, "回到会话");
      back.onclick = function () { openSessionInClient(id); };
      subs.appendChild(back);
    } else {
      var pull = el("button", null, "试读快照");
      pull.onclick = function () {
        pull.disabled = true;
        pull.textContent = "读取中…";
        pullOne(it).then(function (good) {
          if (good) {
            it.pull = "ok";
            toast("读到 " + (it.n || 0) + " 条快照");
          } else {
            toast("云端没有可读快照");
          }
          openDetail(id);
        });
      };
      subs.appendChild(pull);
    }

    var web = el("button", null, "网页版");
    web.onclick = function () { openExternal(WEB + "/app/conversation/" + id); };
    subs.appendChild(web);

    card.appendChild(subs);

    box.appendChild(card);
    return box;
  }

  /**

   */
  function maybeWarnSnapshot(it, id, n) {
    var key = "wbcs.snap." + id;
    try { if (sessionStorage.getItem(key)) return; } catch (e) {}
    try { sessionStorage.setItem(key, "1"); } catch (e) {}

    var mp = it.origin === "workbuddy-mp" || it.origin === "workbuddy-app";
    var t = relTime(it.ts);

    document.getElementById("snapSub").textContent =
      "面板里是 " + n + " 条本机快照" + (t ? "（" + t.abs + "）" : "") + "，不一定是最新。";

    document.getElementById("snapTip").textContent = mp
      ? "这类会话来自小程序 / 手机端，客户端打开可能显示「暂无对话记录」，那种情况用网页版看。"
      : "客户端打开的是同一条会话，历史完整，还能接着发消息。";

    var m = document.getElementById("snapModal");

    document.getElementById("snapGo").onclick = function () {
      m.hidden = true;
      openSessionInClient(id);
    };
    document.getElementById("snapWeb").onclick = function () {
      m.hidden = true;
      openExternal(WEB + "/app/conversation/" + id);
    };
    document.getElementById("snapClose").onclick = function () { m.hidden = true; };
    document.getElementById("snapX").onclick = function () { m.hidden = true; };

    /* 点卡片以外的区域不关闭：提醒必须被看见，只能走 ✕ / 先看快照 / Esc */
    m.onpointerdown = null;
    m.onclick = null;

    m.hidden = false;
    document.getElementById("snapClose").focus({ preventScroll: true });
  }

  function filterItems() {

      if (Object.keys(state.origin).length && !state.origin[it.origin]) return false;
      if (!q) return true;
      return (it.title + " " + label(it.origin) + " " + it.id).toLowerCase().indexOf(q) >= 0;
    });
    var sorters = {
      recent: function (a, b) { return (b.ts || 0) - (a.ts || 0); },
      old: function (a, b) { return (a.ts || 0) - (b.ts || 0); },
      msgs: function (a, b) { return (b.n || 0) - (a.n || 0); },
      title: function (a, b) { return String(a.title).localeCompare(String(b.title), "zh"); }
    };
    list.sort(sorters[state.sort] || sorters.recent);
    // 收藏置顶
    list.sort(function (a, b) { return (isFav(b.id) ? 1 : 0) - (isFav(a.id) ? 1 : 0); });
    return list;
  }

  /* ================= 全文搜索 ================= */
  function ensureSearch(cb) {
    if (SEARCH) return cb(null, SEARCH);
    var s = document.createElement("script");
    s.src = "./full/_search.js";
    s.onload = function () {
      var raw = window.__WBCS_SEARCH__;
      SEARCH = (raw && raw.items) || [];
      SEARCH_BY_ID = {};
      SEARCH.forEach(function (p) { SEARCH_BY_ID[p[0]] = p[1]; });
      log("search/index", SEARCH.length + " 条会话");
      cb(null, SEARCH);
    };
    s.onerror = function () { SEARCH = []; SEARCH_BY_ID = {}; cb(new Error("无搜索索引")); };
    document.head.appendChild(s);
  }

  function highlight(text, q) {
    var s = esc(text);
    if (!q) return s;
    var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    return s.replace(re, "<mark>$1</mark>");
  }

  function renderSearch() {
    renderChips();
    var box = document.getElementById("listView");
    box.textContent = "";
    var q = state.q.trim();
    if (q.length < 2) {
      box.appendChild(el("div", "empty", "至少输入 2 个字符再搜全文"));
      return;
    }
    document.getElementById("count").textContent = "全文搜索：" + q;

    ensureSearch(function () {
      var ql = q.toLowerCase();
      var rows = [];
      DATA.items.forEach(function (it) {
        if (Object.keys(state.origin).length && !state.origin[it.origin]) return;
        var titleHit = it.title.toLowerCase().indexOf(ql) >= 0;
        /* 云端索引更全，优先用；没有再退回 build 时的静态索引 */
        var entries = CLOUD_IDX[it.id] || (SEARCH_BY_ID && SEARCH_BY_ID[it.id]) || [];
        var matched = entries.filter(function (e) { return (e[2] || "").toLowerCase().indexOf(ql) >= 0; });
        if (!titleHit && !matched.length) return;
        rows.push({ it: it, titleHit: titleHit, matched: matched });
      });
      rows.sort(function (a, b) { return b.matched.length - a.matched.length || (b.it.ts || 0) - (a.it.ts || 0); });

      if (!rows.length) {
        box.appendChild(el("div", "empty", "没有命中「" + q + "」的会话"));
        return;
      }
      var head = el("div", "group-h", "命中 " + rows.length + " 条会话 / " +
        rows.reduce(function (a, b) { return a + b.matched.length; }, 0) + " 处");
      box.appendChild(head);

      rows.forEach(function (r) {
        var hit = el("div", "hit");
        hit.onclick = function () {
          if (r.matched.length) openDetail(r.it.id, r.matched[0][0], q);
          else openDetail(r.it.id, null, q);
        };
        var h1 = el("div", "h1");
        h1.innerHTML = "<span class='tag'>" + esc(label(r.it.origin)) + "</span>" +
          (r.titleHit ? highlight(r.it.title, q) : esc(r.it.title)) +
          "<span class='badge-n'>" + (r.it.n || 0) + " 条</span>";
        hit.appendChild(h1);
        var hm = el("div", "hm");
        r.matched.slice(0, 3).forEach(function (e) {
          var role = ROLE_NAME[e[1]] || "消息";
          var snip = e[2];
          var pos = snip.toLowerCase().indexOf(ql);
          var start = Math.max(0, pos - 40);
          var cut = snip.slice(start, start + 160);
          var span = el("span", "snip");
          span.innerHTML = "<span class='tag'>" + role + "</span>" + highlight((start > 0 ? "…" : "") + cut, q);
          hm.appendChild(span);
        });
        if (r.matched.length > 3) hm.appendChild(el("span", "snip", "…另有 " + (r.matched.length - 3) + " 处"));
        hit.appendChild(hm);
        box.appendChild(hit);
      });
    });
  }

  /* ================= 会话内查找 ================= */
  function clearHits() {
    state.hits.forEach(function (n) {
      if (n.__orig != null) n.innerHTML = n.__orig;
      delete n.__orig;
    });
    state.hits = []; state.hitIdx = -1;
    document.getElementById("fcnt").textContent = "0/0";
  }

  function findInSession(q) {
    clearHits();
    if (!q || q.length < 1) return;
    var body = document.getElementById("dBody");
    var nodes = body.querySelectorAll(".bubble, details.fold > summary .t, details.fold .inner pre, .md li, .md p, .md td");
    var re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    var hits = [];
    nodes.forEach(function (n) {
      if (n.querySelector && n.querySelector("mark")) return;
      var html = n.innerHTML;
      if (html.indexOf("<mark>") >= 0) return;
      if (!re.test(n.textContent || "")) return;
      re.lastIndex = 0;
      n.__orig = html;
      n.innerHTML = esc(n.textContent || "").replace(re, "<mark>$&</mark>");
      hits.push(n);
    });
    state.hits = hits;
    state.hitIdx = hits.length ? 0 : -1;
    document.getElementById("fcnt").textContent = (hits.length ? 1 : 0) + "/" + hits.length;
    if (hits.length) jumpHit(0);
  }

  function jumpHit(i) {
    var hits = state.hits;
    if (!hits.length) return;
    state.hitIdx = (i + hits.length) % hits.length;
    var n = hits[state.hitIdx];
    var target = n.closest(".turn, details, .hit") || n;
    target.scrollIntoView({ block: "center" });
    document.getElementById("fcnt").textContent = (state.hitIdx + 1) + "/" + hits.length;
  }

  /* ================= 详情 ================= */
  function toMarkdown(shard) {
    var lines = ["# " + (shard.title || "(无标题)"), ""];
    lines.push("> 会话 ID：`" + shard.id + "`  ");
    lines.push("> 网页版：https://www.workbuddy.cn/app/conversation/" + shard.id);
    lines.push("");
    (shard.messages || []).forEach(function (m) {
      var r = m[0];
      if (r === "t") {
        lines.push("<details><summary>🔧 " + (m[3] || "工具调用") + (m[4] ? " · " + m[4] : "") + "</summary>");
        lines.push("");
        if (m[5]) { lines.push("**输入**", "```", m[5], "```"); }
        if (m[6]) { lines.push("**输出**", "```", m[6], "```"); }
        lines.push("", "</details>", "");
      } else if (r === "h") {
        lines.push("<details><summary>💭 思考过程</summary>", "", m[1] || "", "", "</details>", "");
      } else {
        lines.push("### " + (ROLE_NAME[r] || "消息"), "", m[1] || "", "");
      }
    });
    return lines.join("\n");
  }

  function openDetail(id, jumpIdx, findQ) {
    var it = DATA.items.find(function (x) { return x.id === id; }) || { id: id, title: id, origin: "" };
    state.current = it;
    state.view = "detail";
    syncChrome();
    document.getElementById("listView").classList.add("off");
    document.getElementById("statsView").classList.remove("on");
    document.getElementById("detailView").classList.add("on");
    document.getElementById("main").scrollTop = 0;
    document.getElementById("dTitle").textContent = it.title;
    var t = relTime(it.ts);
    document.getElementById("dSub").textContent =
      (t ? t.abs + " · " : "") + label(it.origin) + " · " +
      (it.n ? it.n + " 条" : "正文未缓存");
    setFavLabel(isFav(id));

    /* 主按钮跟着来源走：小程序/App 来源指向网页版，别把人送进客户端的空壳 */
    var webOnly = webFirst(it.origin);
    var chatBtn = document.getElementById("dChat");
    chatBtn.textContent = webOnly ? "网页版继续" : "回融合会话";
    chatBtn.title = webOnly
      ? "这条来自" + label(it.origin) + "，客户端里没有正文；网页版能看到完整历史并接着聊"
      : "在客户端里打开这条会话本身（同一个 Session），接着在它里面聊";
    document.getElementById("dChatForce").hidden = !webOnly;
    location.hash = "#/s/" + id + (jumpIdx != null ? "/" + jumpIdx : "");

    var body = document.getElementById("dBody");
    body.textContent = "";
    log("open", id);

    /* 三种正文来源，优先级从高到低：
     *   ① 扩展内 service 直连云端（最新、最全，不用扫码）
     *   ② 本机快照分片（可能半截）
     *   ③ 本机 daemon 的 requests（local 会话才有）
     * 先秒开快照，再让云端在后面补 —— 比一直转圈更接近「打开就是最新」。 */
    function paint(shard, src) {
      var got = (shard.messages || []).length;
      if (!got) {
        body.textContent = "";
        body.appendChild(uncachedCard(it, id));
        return;
      }
      /* 回放中会反复重绘，滚动位置得自己接住，否则每 300ms 跳回顶部 */
      var mainEl = document.getElementById("main");
      var sc = mainEl.scrollTop;
      var atBottom = sc + mainEl.clientHeight >= mainEl.scrollHeight - 48;
      var frag = document.createDocumentFragment();
      frag.appendChild(
        src === "cloud" ? cloudNote(shard)
          : src === "live" ? liveNote(shard)
          : snapNote(it, id, got)
      );
      frag.appendChild(renderThread(shard, src === "live" ? null : jumpIdx));
      frag.appendChild(endCard(it, got, src));
      body.textContent = "";
      body.appendChild(frag);
      if (src === "snap") maybeWarnSnapshot(it, id, got);
      var t = relTime(it.ts);
      document.getElementById("dSub").textContent =
        (t ? t.abs + " · " : "") + label(it.origin) + " · " + got + " 条" +
        (src === "cloud" ? " · 云端最新" : src === "live" ? " · 云端回放中" : "");
      mainEl.scrollTop = atBottom ? mainEl.scrollHeight : sc;
      if (findQ && findQ.length >= 1) {
        document.getElementById("findbar").classList.add("on");
        document.getElementById("fq").value = findQ;
        setTimeout(function () { findInSession(findQ); }, 60);
      }
    }

    function stillHere() {
      return state.view === "detail" && state.current && state.current.id === id;
    }

    /* 回放过程中边拉边画：第一段正文通常 0.5~1s 就到了，
     * 不必等整条会话回放完（尾部还要等静默收尾）。
     * 只有「本来没有快照」时才开这个轮询 —— 有快照的场景已经在显示内容了，别抖。 */
    var peekTimer = null;
    var peekN = 0;
    var peekStartedAt = 0;
    function stopPeek() {
      if (peekTimer) { clearInterval(peekTimer); peekTimer = null; }
    }
    function startPeek() {
      if (SB.state() === "off" || typeof SB.peek !== "function") return;
      stopPeek();
      peekStartedAt = Date.now();
      peekTimer = setInterval(function () {
        if (!stillHere() || Date.now() - peekStartedAt > 90000) return stopPeek();
        SB.peek(id).then(function (r) {
          if (!stillHere()) return stopPeek();
          if (!r || r.ok !== true || !r.n || r.n <= peekN) return;
          peekN = r.n;
          paint({
            id: id,
            ok: true,
            title: r.title || it.title,
            stats: r.stats,
            messages: r.messages,
            events: r.events,
            fetchedAt: Date.now(),
            live: true
          }, "live");
        });
      }, 280);
    }

    function fromCloud() {
      if (SB.state() === "off") return Promise.reject(new Error("service 不可用"));
      return SB.fetchBody(id, it.ts ? { ts: it.ts } : null).then(function (r) {
        var shard = r.shard || r;
        shard.id = id;
        acceptShard(it, shard, "cloud");
        stopPeek();
        if (stillHere()) paint(shard, "cloud");
        return shard;
      });
    }

    /* 老路径：本机分片 → 本机 daemon，全失败才给「回到会话」落地卡 */
    function fromLocal(onFail) {
      loadSession(id, function (err, shard) {
        if (err) {
          log("shard", "miss " + err.message);
          if (!stillHere()) return;
          if (it.live || it.pull === "fail" || !it.n) {
            body.textContent = "";
            body.appendChild(uncachedCard(it, id));
            if (onFail) onFail();
            return;
          }
          body.textContent = "";
          var s = shard || { id: id, ok: false, messages: [] };
          s.id = id;
          body.appendChild(renderThread(s, null));
          return;
        }
        log("shard", "ok " + (shard.messages || []).length + " msgs");
        if (!stillHere()) return;
        paint(shard, "snap");
      });
    }

    var snap = SESSIONS[id];
    var hasSnap = !!(snap && (snap.messages || []).length);
    /* 预取/刚拉过的云端正文按「云端最新」展示，别再走快照那套提醒 */
    if (hasSnap) paint(snap, snap.src === "cloud" ? "cloud" : "snap");
    else {
      body.appendChild(stateBox(
        "正在从云端拉取正文…",
        SB.state() === "off" ? "云端直连不可用，先看本机快照。" : "走扩展内的 Node 服务直连云端，不用扫码。"
      ));
      startPeek();
    }

    fromCloud().catch(function (e) {
      log("cloud/fail", e.message + (e.code ? " [" + e.code + "]" : ""));
      stopPeek();
      if (hasSnap) return;            // 已经有快照在显示，失败就不打扰
      fromLocal(function () {
        if (!it.n) toast("没拉到正文，可以先「回到会话」看最新");
      });
    });
  }

  function closeDetail() {
    clearHits();
    document.getElementById("detailView").classList.remove("on");
    document.getElementById("findbar").classList.remove("on");
    document.getElementById("listView").classList.remove("off");
    state.current = null;
    state.view = "list";
    syncChrome();
    location.hash = state.q ? "#/q/" + encodeURIComponent(state.q) : "";
    render();

  /* ================= 统计 ================= */

    var days = [], now = new Date();
    now.setHours(0, 0, 0, 0);
    for (var i = 29; i >= 0; i--) {
      var d = new Date(now.getTime() - i * 86400000);
      days.push({ t: d.getTime(), n: 0, label: (d.getMonth() + 1) + "/" + d.getDate() });
    }
    items.forEach(function (it) {

    });

    box.appendChild(chart);

    box.appendChild(el("div", "sec-t", "消息最多的会话"));
    items.slice().sort(function (a, b) { return (b.n || 0) - (a.n || 0); }).slice(0, 8).forEach(function (it) {
      var row = el("div", "row");

      body.appendChild(el("div", "sub", label(it.origin) + " · " + (relTime(it.ts) ? relTime(it.ts).abs : "")));
      row.appendChild(el("span", "dot")).dataset.o = it.origin;
      row.appendChild(body);
      box.appendChild(row);
    });
