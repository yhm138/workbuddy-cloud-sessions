<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>云端会话</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f6f7f9;
    --bg-hover: #eef0f4;
    --bg-active: #e6edfb;
    --fg: #1a1d21;
    --fg-dim: #6b7280;
    --line: #e5e7eb;
    --accent: #2f6feb;
    --me: #eaf1ff;
    --ai: #f5f6f8;
    --mark: #ffe58f;
    --mark-fg: #1a1d21;
    --badge-web: #2f6feb;
    --badge-mp: #16a34a;
    --badge-task: #b45309;
    --badge-app: #7c3aed;
    --shadow: 0 6px 24px rgba(15, 23, 42, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1d21;
      --bg-soft: #23262b;
      --bg-hover: #2b2f36;
      --bg-active: #2a3345;
      --fg: #e8eaed;
      --fg-dim: #9aa0a6;
      --line: #31353b;
      --accent: #6ea0ff;
      --me: #26324a;
      --ai: #24272c;
      --mark: #6b5a1f;
      --mark-fg: #ffe9a8;
      --badge-web: #6ea0ff;
      --badge-mp: #4ade80;
      --badge-task: #fbbf24;
      --badge-app: #a78bfa;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }
  }
  html[data-theme="dark"] {
    --bg: #1b1d21; --bg-soft: #23262b; --bg-hover: #2b2f36; --bg-active: #2a3345;
    --fg: #e8eaed; --fg-dim: #9aa0a6; --line: #31353b; --accent: #6ea0ff;
    --me: #26324a; --ai: #24272c; --mark: #6b5a1f; --mark-fg: #ffe9a8;
  }
  html[data-theme="light"] {
    --bg: #ffffff; --bg-soft: #f6f7f9; --bg-hover: #eef0f4; --bg-active: #e6edfb;
    --fg: #1a1d21; --fg-dim: #6b7280; --line: #e5e7eb; --accent: #2f6feb;
    --me: #eaf1ff; --ai: #f5f6f8; --mark: #ffe58f; --mark-fg: #1a1d21;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button, .btn {
    font: inherit; color: var(--fg); background: var(--bg-soft);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px;
    cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap;
  }
  button:hover, .btn:hover { background: var(--bg-hover); }
  button:disabled { opacity: .45; cursor: default; }
  input, select {
    font: inherit; color: var(--fg); background: var(--bg-soft);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .spacer { flex: 1; }
  .mono { font-family: ui-monospace, Consolas, monospace; }

  header {
    padding: 11px 16px 9px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  .title-row { display: flex; align-items: center; gap: 8px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; }
  .meta { color: var(--fg-dim); font-size: 11.5px; white-space: nowrap; }
  .search-wrap { position: relative; margin-top: 9px; display: flex; gap: 6px; }
  .search-wrap input { flex: 1; min-width: 0; padding-left: 26px; }
  .search-wrap .ico {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    color: var(--fg-dim); pointer-events: none; font-size: 12px;
  }
  .search-wrap .scope { padding: 6px 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
    background: transparent; color: var(--fg-dim); font-size: 12px; cursor: pointer;
  }
  .chip[data-on="1"] { background: var(--bg-active); color: var(--fg); border-color: var(--accent); }
  .chip .c { opacity: .65; margin-left: 4px; }

  main { flex: 1; overflow-y: auto; position: relative; }
  .group-h {
    position: sticky; top: 0; z-index: 1; padding: 9px 16px 6px;
    font-size: 11.5px; letter-spacing: .02em; color: var(--fg-dim); background: var(--bg);
    display: flex; align-items: center; gap: 6px;
  }
  .row {
    display: flex; gap: 9px; align-items: flex-start; padding: 7px 16px;
    cursor: pointer; border-left: 2px solid transparent;
  }
  .row:hover { background: var(--bg-hover); border-left-color: var(--accent); }
  .row.sel { background: var(--bg-active); border-left-color: var(--accent); }
  .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; flex: 0 0 auto; background: var(--fg-dim); }
  .dot[data-o="agents"] { background: var(--badge-web); }
  .dot[data-o="workbuddy-mp"] { background: var(--badge-mp); }
  .dot[data-o="scheduler"] { background: var(--badge-task); }
  .dot[data-o="workbuddy-app"] { background: var(--badge-app); }
  .body { min-width: 0; flex: 1; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--fg-dim); font-size: 11.5px; margin-top: 1px; display: flex; gap: 7px; align-items: center; }
  .badge-n {
    font-size: 10.5px; color: var(--fg-dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: 1px;
  }
  .fav-star { color: #f0a020; }
  .empty { padding: 40px 16px; text-align: center; color: var(--fg-dim); }
  footer {
    border-top: 1px solid var(--line); padding: 6px 16px;
    color: var(--fg-dim); font-size: 11px; background: var(--bg);
  }
  footer details summary { cursor: pointer; }
  pre {
    margin: 8px 0 0; padding: 8px; border-radius: 6px; background: var(--bg-soft); color: var(--fg);
    font: 11px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap;
    word-break: break-all; max-height: 200px; overflow: auto;
  }
  .toast {
    position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%) translateY(6px);
    background: #111; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px;
    opacity: 0; transition: .18s; pointer-events: none; z-index: 99; max-width: 80%;
  }
  .toast.show { opacity: .94; transform: translateX(-50%) translateY(0); }

  /* ---------- 续聊引导弹层 ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 120; padding: 18px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15, 23, 42, .42);
  }
  .modal[hidden] { display: none; }
  .modal .card {
    width: min(440px, 100%); max-height: 100%; overflow: auto;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); padding: 18px 18px 14px;
  }
  .modal h3 { margin: 0; font-size: 15px; line-height: 1.4; }
  .modal .sub { margin: 6px 0 0; font-size: 12.5px; color: var(--fg-dim); line-height: 1.6; }
  .modal ol { margin: 12px 0 10px; padding-left: 20px; font-size: 12.5px; line-height: 1.95; }
  .modal ol b { color: var(--fg); }
  .modal .tip {
    margin: 0; font-size: 12px; color: var(--fg-dim); line-height: 1.6;
    background: var(--bg-soft); border-radius: 6px; padding: 8px 10px;
  }
  .modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .modal .acts button {
    padding: 6px 13px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg-soft); color: var(--fg);
  }
  .modal .acts button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- 全屏面板 ---------- */
  #detailView, #statsView { display: none; }
  #detailView.on, #statsView.on { display: block; }
  #listView.off { display: none; }
  .bar {
    position: sticky; top: 0; z-index: 4; background: var(--bg);
    display: flex; align-items: center; gap: 6px; padding: 8px 12px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .bar .dt { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .bar .ds { color: var(--fg-dim); font-size: 11px; }
  .bar .col { min-width: 0; display: flex; flex-direction: column; }
  .findbar { display: none; padding: 6px 12px; gap: 6px; align-items: center; border-bottom: 1px solid var(--line); background: var(--bg-soft); }
  .findbar.on { display: flex; }
  .findbar input { flex: 1; min-width: 0; padding: 4px 8px; }
  .findbar .cnt { color: var(--fg-dim); font-size: 11px; white-space: nowrap; }

  /* ---------- 消息 ---------- */
  .thread { padding: 12px 14px 40px; }
  .turn { margin: 0 0 13px; }
  .turn .who { font-size: 11px; color: var(--fg-dim); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
  .turn.user { display: flex; flex-direction: column; align-items: flex-end; }
  .turn.user .bubble { background: var(--me); border: none; max-width: 90%; }
  .turn .bubble {
    background: var(--ai); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 12px; font-size: 12.5px; line-height: 1.65; word-break: break-word;
  }
  .turn .bubble.md > :first-child { margin-top: 0; }
  .turn .bubble.md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 8px; }
  .md h1, .md h2, .md h3, .md h4, .md h5 { margin: 12px 0 6px; line-height: 1.35; }
  .md h1 { font-size: 15px; } .md h2 { font-size: 14.5px; } .md h3 { font-size: 13.5px; } .md h4 { font-size: 13px; }
  .md ul, .md ol { margin: 6px 0 8px; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md code { background: var(--bg-hover); padding: 1px 4px; border-radius: 4px; font: 11.5px ui-monospace, Consolas, monospace; }
  .md pre { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 7px; padding: 9px; overflow: auto; max-height: 380px; margin: 8px 0; }
  .md pre code { background: none; padding: 0; font-size: 11.5px; line-height: 1.5; }
  .md blockquote { margin: 8px 0; padding: 2px 10px; border-left: 3px solid var(--line); color: var(--fg-dim); }
  .md table { border-collapse: collapse; margin: 8px 0; font-size: 12px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; }
  .md a { color: var(--accent); }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }
  .md img { max-width: 100%; }
  mark { background: var(--mark); color: var(--mark-fg); border-radius: 2px; padding: 0 1px; }
  .turn.flash { animation: flash 1.6s ease; }
  @keyframes flash { 0%,40% { background: var(--bg-active); } 100% { background: transparent; } }

  details.fold { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; }
  details.fold > summary {
    cursor: pointer; padding: 6px 10px; font-size: 11.5px; color: var(--fg-dim);
    display: flex; gap: 6px; align-items: center; list-style: none;
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸"; font-size: 10px; }
  details.fold[open] > summary::before { content: "▾"; }
  details.fold > summary .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  details.fold .inner { padding: 0 10px 8px; }
  .k { font: 10.5px/1.4 ui-monospace, Consolas, monospace; padding: 0 5px; border-radius: 4px; background: var(--bg-hover); color: var(--fg-dim); flex: 0 0 auto; }
  .st-done { color: #16a34a; } .st-run { color: #b45309; } .st-fail { color: #dc2626; }
  .turn.thought .bubble { background: transparent; border-style: dashed; color: var(--fg-dim); font-size: 12px; }

  /* ---------- 搜索命中 ---------- */
  .hit { padding: 8px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .hit:hover { background: var(--bg-hover); }
  .hit .h1 { font-size: 12.5px; }
  .hit .hm { color: var(--fg-dim); font-size: 11.5px; margin-top: 2px; line-height: 1.6; }
  .hit .hm .snip { display: block; margin-top: 2px; }
  .hit .tag { font-size: 10px; color: var(--fg-dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 5px; }

  /* ---------- 统计 ---------- */
  .stats { padding: 14px 16px 40px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .card { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: var(--bg-soft); }
  .card .v { font-size: 18px; font-weight: 600; }
  .card .k2 { color: var(--fg-dim); font-size: 11px; }
  .sec-t { font-size: 12px; font-weight: 600; margin: 14px 0 8px; }
  .barline { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; }
  .barline .lb { width: 72px; color: var(--fg-dim); flex: 0 0 auto; }
  .barline .tr { flex: 1; height: 8px; background: var(--bg-hover); border-radius: 4px; overflow: hidden; }
  .barline .fi { height: 100%; background: var(--accent); border-radius: 4px; }
  .barline .nm { width: 46px; text-align: right; color: var(--fg-dim); flex: 0 0 auto; }
  .days { display: flex; align-items: flex-end; gap: 2px; height: 64px; margin-top: 6px; }
  .days i { flex: 1; background: var(--accent); opacity: .75; border-radius: 2px 2px 0 0; min-height: 1px; }
  .days-x { display: flex; justify-content: space-between; color: var(--fg-dim); font-size: 10px; margin-top: 3px; }

  .state { padding: 26px 16px; text-align: center; color: var(--fg-dim); }
  .state .big { font-size: 13px; color: var(--fg); margin-bottom: 6px; }
  .state .actions { margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* 版本自检条：宿主清单是启动时快照的，热部署后会短暂不一致 */
  .vbar { display: flex; gap: 10px; align-items: flex-start; margin: 10px 12px 2px; padding: 8px 10px;
    border: 1px solid #f0d49b; background: #fff8e8; color: #7a4d00; border-radius: 8px; font-size: 11.5px; line-height: 1.55; }
  .vbar .vbar-txt { flex: 1; }
  .vbar button { flex: 0 0 auto; font-size: 11px; padding: 2px 8px; }
  html[data-theme="dark"] .vbar { background: #33280f; border-color: #5c4718; color: #f0cf8a; }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) .vbar { background: #33280f; border-color: #5c4718; color: #f0cf8a; }
  }
  @media (min-width: 760px) {
    header, main, footer { width: 100%; max-width: 920px; margin-left: auto; margin-right: auto; }
  }
  @media (max-width: 520px) {
    .bar .btn-hide { display: none; }
  }
</style>
<script>
/* ------------------------------------------------------------------
 * 宿主 Guest 通道（必须尽早就位）
 *
 * 桌面端把扩展挂在 iframe 里，加载完成后会向 iframe postMessage：
 *   { type: "__wb_port_init__", readyToken } + MessagePort(port2)
 * guest 必须在 10s 内通过这个 port 回一条
 *   { type:"wb:invoke:request", channel:"wb:boundary:guest-ready",
 *     args:[{ readyToken }] }
 * 否则宿主判定握手失败，界面就显示「插件加载失败 / 请检查网络后重新加载」
 * （日志里是 "Guest Ready timed out after 10000ms: <extensionId>"）。
 * 同时宿主的 wb:* 能力（openExternal / message:fill / http:get ...）
 * 也只能走这条 MessagePort，window.parent.postMessage 那条老路宿主不再监听。
 * 所以这段放在 <head> 里、页面前，抢在超时之前完成握手。
 * ------------------------------------------------------------------ */
(function () {
  "use strict";
  var G = {
    port: null, token: "", ready: false, via: "", seq: 0,
    pending: {}, events: {}, lines: []
  };
  window.__WBCS_GUEST__ = G;

  function note(s) {
    try { G.lines.push(s); if (G.lines.length > 30) G.lines.shift(); } catch (e) {}
  }
  G.note = note;

  function send(msg) {
    try { G.port.postMessage(msg); return true; }
    catch (e) { note("port 发送失败: " + (e && e.message)); return false; }
  }

  function settle(d) {
    var p = G.pending[d.requestId];
    if (!p) return;
    delete G.pending[d.requestId];
    if (p.timer) clearTimeout(p.timer);
    if (d.error) {
      var err = new Error((d.error && d.error.message) || "宿主调用失败");
      err.code = d.error && d.error.code;
      p.reject(err);
    } else {
      p.resolve(d.result);
    }
  }

  function onPortMessage(ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== "object" || typeof d.type !== "string") return;
    if (d.type === "wb:invoke:response") { settle(d); return; }
    if (d.type === "wb:event") {
      var list = G.events[d.event] || [];
      for (var i = 0; i < list.length; i++) {
        try { list[i](d.payload); } catch (e) {}
      }
      return;
    }
    if (d.type === "wb:invoke:request") {
      send({
        type: "wb:invoke:response",
        requestId: d.requestId,
        error: { message: "本扩展没有对外暴露方法: " + d.channel, code: "WB_GUEST_CHANNEL_NOT_FOUND" }
      });
    }
  }

  G.on = function (name, fn) {
    (G.events[name] = G.events[name] || []).push(fn);
  };

  G.invoke = function (channel, args, timeout) {
    return new Promise(function (resolve, reject) {
      if (!G.port) { reject(new Error("宿主通道未建立")); return; }
      var id = "g-" + (++G.seq);
      var timer = setTimeout(function () {
        delete G.pending[id];
        reject(new Error("宿主调用超时：" + channel));
      }, timeout || 20000);
      G.pending[id] = { resolve: resolve, reject: reject, timer: timer };
      if (!send({ type: "wb:invoke:request", requestId: id, channel: channel, args: args || [] })) {
        clearTimeout(timer); delete G.pending[id];
        reject(new Error("无法发送宿主调用：" + channel));
      }
    });
  };

  /* 把 ready 当成一次普通 invoke 发出去；宿主把该 channel 注册成 ready gate */
  function hello(token) {
    var id = "ready-" + (++G.seq);
    G.pending[id] = {
      timer: 0,
      resolve: function () { G.ready = true; note("guest-ready 已确认"); },
      reject: function (e) { note("guest-ready 被拒: " + e.message); }
    };
    var payload = token ? { readyToken: token } : {};
    if (!send({ type: "wb:invoke:request", requestId: id, channel: "wb:boundary:guest-ready", args: [payload] })) {
      delete G.pending[id];
      note("guest-ready 发送失败");
    }
  }

  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || typeof d !== "object") return;

    if (d.type === "__wb_port_init__") {
      if (G.port) return;
      var port = ev.ports && ev.ports[0];
      if (!port) { note("port init 里没有 MessagePort"); return; }
      G.port = port;
      G.token = d.readyToken || "";
      G.via = "port";
      port.addEventListener("message", onPortMessage);
      try { port.start(); } catch (e) {}
      hello(G.token);
      return;
    }

    /* 兼容：万一宿主走的是老的 window-message 桥 */
    if (d.type === "wb:handshake:response" || d.type === "wb:invoke:response") settle(d);
  }, false);

  note("guest 已就位，等待宿主 port");
})();
</script>
</head>
<body>
<header>
  <div class="title-row">
    <h1>云端会话</h1>
    <span class="meta" id="count"></span>
    <span class="spacer"></span>
    <button id="syncBtn" title="从云端拉最新会话列表（走宿主网络通道）">同步</button>
    <button id="statsBtn" title="统计">统计</button>
    <button id="webBtn" class="btn-hide" title="在浏览器打开网页版">网页版</button>
  </div>
  <div class="search-wrap">
    <span class="ico">⌕</span>
    <input id="q" placeholder="搜索标题 / 正文（回车搜全文）" autocomplete="off" spellcheck="false" />
    <select id="scope" class="scope" title="搜索范围">
      <option value="title">标题</option>
      <option value="all">全文</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="main">
  <div id="listView"></div>

  <div id="detailView">
    <div class="bar">
      <button id="back" title="返回（Esc）">←</button>
      <div class="col">
        <div class="dt" id="dTitle">—</div>
        <div class="ds" id="dSub">—</div>
      </div>
      <span class="spacer"></span>
      <button id="dFind" title="会话内查找（Ctrl+F）">查找</button>
      <button id="dFav" title="收藏（列表置顶）">☆</button>
      <button id="dChat" title="用深链在客户端打开这条会话本身（同一个 Session），接着在它里面聊">回到会话</button>
      <button id="dFill" title="把这段历史上下文填进当前输入框（不跳转），用于开新会话">填上下文</button>
      <button id="dCopy" class="btn-hide" title="复制会话 ID">ID</button>
      <button id="dMd" title="复制整条会话为 Markdown">MD</button>
      <button id="dWeb" title="在网页版打开">↗</button>
    </div>
    <div class="findbar" id="findbar">
      <input id="fq" placeholder="在本会话内查找…" autocomplete="off" />
      <span class="cnt" id="fcnt">0/0</span>
      <button id="fprev" title="上一个（Shift+Enter）">↑</button>
      <button id="fnext" title="下一个（Enter）">↓</button>
      <button id="fclose" title="关闭">✕</button>
    </div>
    <div id="dBody"></div>
  </div>

  <div id="statsView">
    <div class="bar">
      <button id="sBack">←</button>
      <div class="col"><div class="dt">统计</div><div class="ds" id="sSub">—</div></div>
    </div>
    <div class="stats" id="sBody"></div>
  </div>
</main>

<footer>
  <details>
    <summary>数据与诊断</summary>
    <pre id="diag">…</pre>
  </details>
</footer>
<div class="toast" id="toast"></div>

<div class="modal" id="fillModal" hidden>
  <div class="card">
    <h3>上下文已经填进 WorkBuddy 的输入框了</h3>
    <p class="sub" id="fillSub">—</p>
    <ol>
      <li>先离开这个面板：点左上角 <b>←</b>，或按 <b>Esc</b></li>
      <li>回到对话页，<b>底部输入框</b>里就是这段历史上下文</li>
      <li>接着输入你的问题，按 <b>Enter</b> 发送</li>
    </ol>
    <p class="tip" id="fillTip">如果回去发现输入框是空的（宿主有时会把内容丢进尚未打开的新会话），点下面的「复制上下文」直接粘贴即可。</p>
    <div class="acts">
      <button id="fillCopy">复制上下文</button>
      <button id="fillOk" class="primary">知道了</button>
    </div>
  </div>
</div>

<script src="./data.js"></script>
<script>
(function () {
  "use strict";

  // 与 extension.json / distribution.json 保持一致；build 时会校验
  var PAGE_VERSION = "1.0.5";

  /* ================= 基础 ================= */
  var DATA = window.CLOUD_SESSIONS || {
    items: [], total: 0, counts: {}, originLabels: {}, originOrder: [],
    generatedAt: "?", generatedAtMs: 0, webOrigin: "https://www.workbuddy.cn"
  };
  var WEB = DATA.webOrigin || "https://www.workbuddy.cn";
  var ORDER = DATA.originOrder && DATA.originOrder.length ? DATA.originOrder
    : ["agents", "workbuddy-mp", "workbuddy-app", "scheduler", "workbuddy-deploy", "genie"];
  var ROLE_NAME = { u: "我", a: "助手", h: "思考", t: "工具" };

  var SESSIONS = {};      // id -> shard
  var INDEX = {};         // id -> {n, ok}
  var SEARCH = null;      // [[id, [[idx, role, snippet], ...]], ...]
  var SEARCH_BY_ID = null;
  var FAV = loadFav();
  var fillBroken = false;   // 宿主拒绝过一次 wb:message:fill 后，按钮退化成复制

  var state = {
    q: "",
    scope: "title",
    origin: {},
    sort: "recent",
    view: "list",   // list | search | detail | stats
    current: null,
    hits: [],       // 会话内查找命中节点
    hitIdx: -1
  };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function relTime(ms) {
    if (!ms) return null;
    var d = new Date(ms);
    var abs = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
    var diff = (Date.now() - ms) / 1000, txt;
    if (diff < 60) txt = "刚刚";
    else if (diff < 3600) txt = Math.floor(diff / 60) + " 分钟前";
    else if (diff < 86400) txt = Math.floor(diff / 3600) + " 小时前";
    else if (diff < 86400 * 30) txt = Math.floor(diff / 86400) + " 天前";
    else txt = abs.slice(0, 10);
    return { txt: txt, abs: abs };
  }
  function label(o) { return DATA.originLabels[o] || o || "未知来源"; }
  var toastTimer;
  function toast(msg, ms) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, ms || 1800);
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }
  function copy(text, okMsg) {
    function done() { toast(okMsg || "已复制"); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }
  function download(name, text, mime) {
    try {
      var blob = new Blob([text], { type: (mime || "text/markdown") + ";charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      toast("已开始下载：" + name);
    } catch (e) {
      copy(text, "浏览器不允许下载，已复制到剪贴板");
    }
  }
  /**
   * 诊断区 = 头部状态（宿主通道等，会被多次刷新）+ 追加式日志。
   * 两者分开存，刷新头部时不能把日志冲掉（排查问题时日志才是关键）。
   */
  var LOGLINES = [];
  var diagHeader = [];
  function renderDiag() {
    var pre = document.getElementById("diag");
    if (!pre) return;
    pre.textContent = diagHeader.concat(LOGLINES).join("\n");
  }
  function setDiagHeader(lines) { diagHeader = lines || []; renderDiag(); }
  function log(step, detail) {
    LOGLINES.push("[" + new Date().toTimeString().slice(0, 8) + "] " + step + (detail ? " :: " + detail : ""));
    if (LOGLINES.length > 200) LOGLINES.shift();
    renderDiag();
  }
  function webUrl(id) { return id ? WEB + "/app/conversation/" + encodeURIComponent(id) : WEB + "/app"; }

  /* ================= 收藏 ================= */
  function loadFav() {
    try { return JSON.parse(localStorage.getItem("wbcs.fav") || "[]"); } catch (e) { return []; }
  }
  function saveFav() {
    try { localStorage.setItem("wbcs.fav", JSON.stringify(FAV)); } catch (e) {}
  }
  function isFav(id) { return FAV.indexOf(id) >= 0; }
  function toggleFav(id) {
    var i = FAV.indexOf(id);
    if (i >= 0) FAV.splice(i, 1); else FAV.push(id);
    saveFav();
    return i < 0;
  }

  /* ================= 宿主桥接 ================= */
  // 首选 MessagePort 通道（head 里的 __WBCS_GUEST__）；老 postMessage 桥只作兜底。
  // 桌面端 1.0.x 只在 MessagePort 上监听 wb:*，所以 port 没建起来时
  // openExternal / message:fill / config:get 都会失败，只能降级。
  var Bridge = (function () {
    var pending = {}, seq = 0, hs = null, disabled = false;
    function guest() {
      var g = window.__WBCS_GUEST__;
      return g && g.port ? g : null;
    }
    window.addEventListener("message", function (ev) {
      var d = ev.data;
      if (!d || typeof d !== "object" || typeof d.type !== "string") return;
      if (d.type === "wb:handshake:response") {
        if (!hs || hs.id !== d.requestId) return;
        var h = hs; hs = null; clearTimeout(h.timer);
        if (d.error) h.reject(mkErr(d.error, "握手被拒绝")); else h.resolve(true);
        return;
      }
      if (d.type === "wb:invoke:response") {
        var p = pending[d.requestId];
        if (!p) return;
        delete pending[d.requestId];
        clearTimeout(p.timer);
        if (d.error) p.reject(mkErr(d.error, "调用失败")); else p.resolve(d.result);
      }
    });
    function mkErr(e, def) {
      var err = new Error((e && e.message) || def);
      if (e) { err.code = e.code; err.source = e.source; }
      return err;
    }
    function post(msg) { try { window.parent.postMessage(msg, "*"); return true; } catch (e) { return false; } }
    function handshake(timeout) {
      if (guest()) return Promise.resolve(true);
      if (disabled) return Promise.reject(new Error("宿主桥不可用"));
      if (hs) return hs.promise || Promise.reject(new Error("握手进行中"));
      var id = "hs-" + (++seq);
      var promise = new Promise(function (resolve, reject) {
        hs = { id: id, resolve: resolve, reject: reject, promise: null, timer: 0 };
        hs.timer = setTimeout(function () {
          // 注意：这里只把「老桥」标记为不可用，MessagePort 到货后仍可正常工作
          if (hs && hs.id === id) { hs = null; disabled = true; reject(new Error("握手超时：宿主未响应")); }
        }, timeout || 3000);
        if (!post({ type: "wb:handshake:request", requestId: id, protocolVersion: "1.0" })) {
          hs = null; disabled = true; reject(new Error("无法 postMessage 到宿主"));
        }
      });
      if (hs) hs.promise = promise;
      return promise;
    }
    function invoke(channel, args, timeout) {
      var g = guest();
      if (g) return g.invoke(channel, args, timeout);
      return handshake().then(function () {
        return new Promise(function (resolve, reject) {
          var id = "r-" + (++seq);
          var timer = setTimeout(function () {
            delete pending[id];
            reject(new Error("调用超时：" + channel));
          }, timeout || 20000);
          pending[id] = { resolve: resolve, reject: reject, timer: timer };
          if (!post({ type: "wb:invoke:request", requestId: id, channel: channel, args: args || [] })) {
            clearTimeout(timer); delete pending[id]; reject(new Error("无法发送调用：" + channel));
          }
        });
      });
    }
    return {
      invoke: invoke,
      handshake: handshake,
      isDisabled: function () { return !guest() && disabled; },
      via: function () {
        var g = guest();
        if (!g) return disabled ? "none" : "pending";
        return g.ready ? "port" : "port(未确认)";
      }
    };
  })();

  /**
   * 打开外部链接。
   *
   * 不走 wb:shell:openExternal —— 主进程里这个通道的授权是：
   *   subject.type === 'window' && subject.kind === 'builtin'
   * 而扩展 iframe 的 subject.type 固定是 'extension'，必然 PERMISSION_DENIED。
   *
   * 但主窗口的 setWindowOpenHandler 对普通 URL 的处理正好是
   *   「deny + shell.openExternal(url)」
   * 所以从 iframe 里 window.open 就等价于"用系统浏览器打开"。
   * iframe 的 sandbox 带 allow-popups，这条能走通。
   */
  function openExternal(url) {
    var hosted = !!(window.__WBCS_GUEST__ && window.__WBCS_GUEST__.port);
    var w = null;
    try { w = window.open(url, "_blank", "noopener"); } catch (e) { w = null; }
    if (hosted) {
      // 被宿主 deny 时这里返回 null，但已经转交系统浏览器了，不能当失败
      log("openExternal", "window.open → 系统浏览器 " + url);
      toast("已在系统浏览器打开");
      return;
    }
    if (!w) copy(url, "浏览器拦了新窗口，地址已复制");
  }

  /**
   * 直接跳回这条会话本身（同一个 Session），不是搬上下文。
   * 客户端注册了 workbuddy:// 协议（HKCU\Software\Classes\workbuddy → WorkBuddy.exe "%1"），
   * 渲染进程的深链路由里 host=chat、path=<会话 id> 就是"打开该会话"，
   * 证据：tryHandleScheduledTaskArtifactDeepLink 内部拼的就是 `workbuddy://chat/<id>` 再 openConversation。
   * iframe 里 window.open 会被主窗口 setWindowOpenHandler 接走 → shell.openExternal → 回到本进程。
   */
  function openSessionInClient(id) {
    var url = "workbuddy://chat/" + encodeURIComponent(id);
    log("deeplink", url);
    if (window.parent === window || Bridge.isDisabled()) {
      log("deeplink", "没有宿主，改用网页版");
      toast("当前不是客户端环境，改用网页版打开");
      return openExternal(webUrl(id));
    }
    try {
      window.open(url, "_blank", "noopener");
    } catch (e) {
      log("deeplink", "failed: " + e.message);
      toast("深链没发出去，改用网页版");
      return openExternal(webUrl(id));
    }
    // window.open 对自定义协议通常返回 null，不能拿它判断成败，只能看客户端有没有跳过去
    toast("正在客户端打开这条会话（同一 Session）… 面板没自动关就按 Esc", 3200);
    // 兜底：3.5s 后页面还可见，多半是没跳过去（这类会话可能只在云端）
    setTimeout(function () {
      if (document.visibilityState === "visible") {
        toast("没跳过去？点右上角 ↗ 用网页版打开同一条会话", 4200);
      }
    }, 3500);
  }

  /**
   * 把内容填进 WorkBuddy 当前输入框（不自动发送），用于"开一条新会话接着问"。
   * 通道：wb:message:fill，参数 [{ content: ContentBlock[], source }]
   * 浏览器里没有宿主，调用必然失败，退回复制。
   */
  function fillMessage(text) {
    return Bridge.invoke(
      "wb:message:fill",
      [{ content: [{ type: "text", text: text }], source: "cloud-sessions" }],
      8000
    );
  }

  /** 组装「接着聊」的上下文：取最后若干条有内容的对话，控制长度 */
  function buildContext(shard, maxChars) {
    maxChars = maxChars || 4000;
    var picked = [];
    (shard.messages || []).forEach(function (m) {
      var r = m[0];
      if (r !== "u" && r !== "a") return;
      var t = String(m[1] || "").trim();
      if (!t) return;
      picked.push((r === "u" ? "我：" : "助手：") + t);
    });
    if (!picked.length) return "";

    // 从最后往前累加，超长就截断前面的
    var out = [], total = 0;
    for (var i = picked.length - 1; i >= 0; i--) {
      if (total + picked[i].length > maxChars) {
        if (!out.length) out.unshift(picked[i].slice(0, maxChars));
        break;
      }
      out.unshift(picked[i]);
      total += picked[i].length;
    }
    var head =
      "以下是云端会话「" + (shard.title || "") + "」的历史上下文" +
      "（会话 ID " + shard.id + "，来源 " + (DATA.originLabels[shard.origin] || shard.origin) + "）。\n" +
      "请基于这段上下文，接着往下聊我接下来要问的问题。\n\n" +
      "---\n";
    var tail = "\n---\n（以上为历史上下文）";
    return head + out.join("\n\n") + tail;
  }

  function continueChat() {
    if (!state.current) return;
    var item = state.current;
    loadSession(item.id, function (err, shard) {
      if (err || !shard) return toast("这条会话没有本地正文，无法续聊");
      var ctx = buildContext(shard);
      if (!ctx) return toast("这条会话没有可用的对话内容");

      if (fillBroken) return copyContext(ctx);

      fillMessage(ctx).then(function () {
        log("message/fill", "ok " + ctx.length + " 字符");
        showFillHint(item, ctx);
      }).catch(function (e) {
        // 宿主拒了一次就别再让用户重复踩：按钮直接退化成"复制上下文"
        fillBroken = true;
        log("message/fill", "failed: " + e.message + (e.code ? " [" + e.code + "]" : ""));
        var btn = document.getElementById("dFill");
        if (btn) {
          btn.textContent = "复制上下文";
          btn.title = "宿主不允许扩展直接填充，改为复制到剪贴板（粘贴即可）";
        }
        copyContext(ctx);
      });
    });
  }

  function copyContext(ctx) {
    copy(ctx, "已复制 " + ctx.length + " 字上下文，点到聊天框 Ctrl+V 就能接着聊");
  }

  /**
   * 「接着聊」成功后的引导。
   * 宿主只负责把内容塞进输入框，不会关面板、也不会切页面，用户在面板里看不到任何变化，
   * 所以必须把"去哪看"写清楚，并留一个复制兜底（宿主偶尔会丢到未打开的新会话里）。
   */
  var fillCtx = "";
  function showFillHint(item, ctx) {
    fillCtx = ctx;
    var sub = document.getElementById("fillSub");
    if (sub) {
      sub.textContent = "「" + (item.title || item.id) + "」的 " + ctx.length +
        " 字上下文已写入输入框。它就在面板后面，不是没反应。";
    }
    var m = document.getElementById("fillModal");
    if (m) m.hidden = false;
    toast("已填入输入框 · " + ctx.length + " 字");
  }
  function closeFillHint() {
    var m = document.getElementById("fillModal");
    if (m) m.hidden = true;
  }

  /** Markdown 里的外链：统一交给 openExternal（window.open → 系统浏览器） */
  function routeLinks(container) {
    container.addEventListener("click", function (ev) {
      var a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
      if (!a) return;
      var href = a.getAttribute("href") || "";
      if (!/^(https?:|mailto:)/.test(href)) return;
      ev.preventDefault();
      openExternal(href);
    });
  }

  /* -------- 在线同步：走宿主网络通道拉最新会话列表 -------- */
  function httpGet(url, opts) {
    return Bridge.invoke("wb:http:get", [url, opts || {}], 20000);
  }

  /** 把 {code,msg,data} / axios {data:{...}} / 裸 body 这几种包装统一拆掉 */
  function unwrap(res) {
    var r = res;
    if (typeof r === "string") {
      try { r = JSON.parse(r); } catch (e) { return null; }
    }
    if (r && typeof r === "object" && r.data !== undefined && (r.code !== undefined || r.msg !== undefined || r.requestId !== undefined)) {
      r = r.data;
    }
    if (r && typeof r === "object" && r.data && r.data.data !== undefined) r = r.data;
    if (r && typeof r === "object" && r.data && r.data.conversations) r = r.data;
    return r;
  }

  function tsOf(c) {
    var v = c.updatedAt || c.createdAt || c.lastActivityAt;
    if (typeof v === "number") return v;
    if (typeof v === "string") {
      var t = Date.parse(v.replace(" ", "T"));
      return isNaN(t) ? 0 : t;
    }
    return 0;
  }

  function originOf(c) {
    if (c.conversationOrigin) return c.conversationOrigin;
    var envs = (c.manifest && c.manifest.envs) || [];
    for (var i = 0; i < envs.length; i++) {
      if (envs[i].key === "CLIENT_INFO_USER_AGENT_EXTENSION" && envs[i].value) return envs[i].value;
    }
    return "unknown";
  }

  function recount() {
    DATA.total = DATA.items.length;
    var counts = {};
    DATA.items.forEach(function (it) { counts[it.origin] = (counts[it.origin] || 0) + 1; });
    DATA.counts = counts;
  }

  function syncLive() {
    var btn = document.getElementById("syncBtn");
    var old = btn.textContent;
    btn.disabled = true;
    btn.textContent = "同步中…";

    var collected = [];
    function page(p) {
      var url = WEB + "/console/as/conversations/?page_size=20&page=" + p;
      log("sync/page", p);
      return httpGet(url).then(function (res) {
        var d = unwrap(res) || {};
        var list = d.conversations || [];
        collected = collected.concat(list);
        var pgn = d.pagination || {};
        if (pgn.hasNext && p < (pgn.totalPages || 1) && p < 10) return page(p + 1);
        return collected;
      });
    }

    page(1).then(function (list) {
      if (!list.length) throw new Error("接口返回 0 条会话");
      var index = {};
      DATA.items.forEach(function (it) { index[it.id] = it; });
      var added = 0;
      list.forEach(function (c) {
        var id = String(c.id);
        var o = originOf(c);
        if (index[id]) {
          if (c.name) index[id].title = c.name;
          return;
        }
        var it = {
          id: id,
          title: c.name || "(无标题)",
          origin: o,
          originLabel: DATA.originLabels[o] || o,
          ts: tsOf(c),
          created: tsOf(c),
          status: c.status || "",
          n: 0,
          t: 0,
          ok: false,
          live: true
        };
        DATA.items.push(it);
        index[id] = it;
        added++;
      });
      recount();
      render();
      log("sync/ok", list.length + " 条，新增 " + added);
      toast("已同步 " + list.length + " 条会话" + (added ? "，新增 " + added + " 条（正文需重跑 wbcs fetch）" : "，没有新的"));
      btn.textContent = old;
      btn.disabled = false;
    }).catch(function (e) {
      log("sync/failed", e.message + (e.code ? " [" + e.code + "]" : ""));
      toast("同步失败：" + e.message + "（宿主可能未放行网络通道）");

  /* ================= 分片加载 ================= */
  var fullWait = {}, fullFail = {};
  window.__WBCS_SESSION__ = function (data) {
    if (!data || !data.id) return;
    SESSIONS[data.id] = data;
    var q = fullWait[data.id] || [];
    fullWait[data.id] = [];
    q.forEach(function (cb) { cb(null, data); });
  };
  function loadSession(id, cb) {
    if (SESSIONS[id]) return cb(null, SESSIONS[id]);
    if (fullFail[id]) return cb(new Error("no-shard"));
    if (fullWait[id]) { fullWait[id].push(cb); return; }
    fullWait[id] = [cb];
    var s = document.createElement("script");
    s.src = "./full/" + encodeURIComponent(id) + ".js";
    s.onload = function () {
      setTimeout(function () {
        if (SESSIONS[id]) { var q = fullWait[id] || []; fullWait[id] = []; q.forEach(function (f) { f(null, SESSIONS[id]); }); }
        else {
          fullFail[id] = true;
          var q2 = fullWait[id] || []; fullWait[id] = [];
          q2.forEach(function (f) { f(new Error("empty-shard")); });
        }
      }, 20);
    };
    s.onerror = function () {
      fullFail[id] = true;
      var q = fullWait[id] || []; fullWait[id] = [];
      q.forEach(function (f) { f(new Error("no-shard")); });
    };
    document.head.appendChild(s);
  }

  /* ================= Markdown ================= */
  function inlineMd(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]{1,120})\]\((https?:\/\/[^)\s]{1,400})\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function mdToHtml(src) {
    var lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
    var out = [], para = [], list = null, i = 0;
    function flushPara() {
      if (para.length) { out.push("<p>" + para.map(inlineMd).join("<br>") + "</p>"); para = []; }
    }
    function flushList() { if (list) { out.push("</" + list + ">"); list = null; } }
    function flushAll() { flushPara(); flushList(); }

    while (i < lines.length) {
      var line = lines[i];
      var m = /^\s*```(.*)$/.exec(line);
      if (m) {
        flushAll();
        var code = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
        continue;
      }
      if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1]) && /-/.test(lines[i + 1])) {
        flushAll();
        var head = line.split("|").map(function (c) { return c.trim(); });
        if (head[0] === "") head.shift();
        if (head[head.length - 1] === "") head.pop();
        i += 2;
        var rows = [];
        while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim()) {
          var r = lines[i].split("|").map(function (c) { return c.trim(); });
          if (r[0] === "") r.shift();
          if (r[r.length - 1] === "") r.pop();
          rows.push(r); i++;
        }
        var t = "<table><thead><tr>" + head.map(function (c) { return "<th>" + inlineMd(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
        rows.forEach(function (r2) {
          t += "<tr>" + head.map(function (_, k) { return "<td>" + inlineMd(r2[k] || "") + "</td>"; }).join("") + "</tr>";
        });
        out.push(t + "</tbody></table>");
        continue;
      }
      var h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) { flushAll(); var lv = Math.min(h[1].length + 1, 6); out.push("<h" + lv + ">" + inlineMd(h[2]) + "</h" + lv + ">"); i++; continue; }
      if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flushAll(); out.push("<hr>"); i++; continue; }
      if (/^\s*>\s?/.test(line)) {
        flushAll();
        var ql = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) { ql.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
        out.push("<blockquote>" + ql.map(inlineMd).join("<br>") + "</blockquote>");
        continue;
      }
      var ul = /^\s*[-*+]\s+(.*)$/.exec(line);
      var ol = /^\s*\d+[.)]\s+(.*)$/.exec(line);
      if (ul || ol) {
        flushPara();
        var want = ul ? "ul" : "ol";
        if (list !== want) { flushList(); out.push("<" + want + ">"); list = want; }
        out.push("<li>" + inlineMd((ul || ol)[1]) + "</li>");
        i++; continue;
      }
      if (!line.trim()) { flushAll(); i++; continue; }
      flushList();
      para.push(line);
      i++;
    }
    flushAll();
    return out.join("");
  }

  /* ================= 消息渲染 ================= */
  function statusCls(s) {
    s = String(s || "").toLowerCase();
    if (/complet|success|done/.test(s)) return "done";
    if (/fail|error|cancel/.test(s)) return "fail";
    return "run";
  }

  function filterItems() {
    var q = state.q.toLowerCase();
    var list = DATA.items.filter(function (it) {
      if (Object.keys(state.origin).length && !state.origin[it.origin]) return false;
      if (!q) return true;
      return (it.title + " " + label(it.origin) + " " + it.id).toLowerCase().indexOf(q) >= 0;
    });
    var sorters = {
      recent: function (a, b) { return (b.ts || 0) - (a.ts || 0); },
      old: function (a, b) { return (a.ts || 0) - (b.ts || 0); },
      msgs: function (a, b) { return (b.n || 0) - (a.n || 0); },
      title: function (a, b) { return String(a.title).localeCompare(String(b.title), "zh"); }
    };
    list.sort(sorters[state.sort] || sorters.recent);
    // 收藏置顶
    list.sort(function (a, b) { return (isFav(b.id) ? 1 : 0) - (isFav(a.id) ? 1 : 0); });
    return list;
  }

  /* ================= 全文搜索 ================= */
  function ensureSearch(cb) {
    if (SEARCH) return cb(null, SEARCH);
    var s = document.createElement("script");
    s.src = "./full/_search.js";
    s.onload = function () {
      var raw = window.__WBCS_SEARCH__;
      SEARCH = (raw && raw.items) || [];
      SEARCH_BY_ID = {};
      SEARCH.forEach(function (p) { SEARCH_BY_ID[p[0]] = p[1]; });
      log("search/index", SEARCH.length + " 条会话");
      cb(null, SEARCH);
    };
    s.onerror = function () { SEARCH = []; SEARCH_BY_ID = {}; cb(new Error("无搜索索引")); };
    document.head.appendChild(s);
  }

  function highlight(text, q) {
    var s = esc(text);
    if (!q) return s;
    var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    return s.replace(re, "<mark>$1</mark>");
  }

  function renderSearch() {
    renderChips();
    var box = document.getElementById("listView");
    box.textContent = "";
    var q = state.q.trim();
    if (q.length < 2) {
      box.appendChild(el("div", "empty", "至少输入 2 个字符再搜全文"));
      return;
    }
    document.getElementById("count").textContent = "全文搜索：" + q;

    ensureSearch(function () {
      var ql = q.toLowerCase();
      var rows = [];
      DATA.items.forEach(function (it) {
        if (Object.keys(state.origin).length && !state.origin[it.origin]) return;
        var titleHit = it.title.toLowerCase().indexOf(ql) >= 0;
        var entries = (SEARCH_BY_ID && SEARCH_BY_ID[it.id]) || [];
        var matched = entries.filter(function (e) { return (e[2] || "").toLowerCase().indexOf(ql) >= 0; });
        if (!titleHit && !matched.length) return;
        rows.push({ it: it, titleHit: titleHit, matched: matched });
      });
      rows.sort(function (a, b) { return b.matched.length - a.matched.length || (b.it.ts || 0) - (a.it.ts || 0); });

      if (!rows.length) {
        box.appendChild(el("div", "empty", "没有命中「" + q + "」的会话"));
        return;
      }
      var head = el("div", "group-h", "命中 " + rows.length + " 条会话 / " +
        rows.reduce(function (a, b) { return a + b.matched.length; }, 0) + " 处");
      box.appendChild(head);

      rows.forEach(function (r) {
        var hit = el("div", "hit");
        hit.onclick = function () {
          if (r.matched.length) openDetail(r.it.id, r.matched[0][0], q);
          else openDetail(r.it.id, null, q);
        };
        var h1 = el("div", "h1");
        h1.innerHTML = "<span class='tag'>" + esc(label(r.it.origin)) + "</span>" +
          (r.titleHit ? highlight(r.it.title, q) : esc(r.it.title)) +
          "<span class='badge-n'>" + (r.it.n || 0) + " 条</span>";
        hit.appendChild(h1);
        var hm = el("div", "hm");
        r.matched.slice(0, 3).forEach(function (e) {
          var role = ROLE_NAME[e[1]] || "消息";
          var snip = e[2];
          var pos = snip.toLowerCase().indexOf(ql);
          var start = Math.max(0, pos - 40);
          var cut = snip.slice(start, start + 160);
          var span = el("span", "snip");
          span.innerHTML = "<span class='tag'>" + role + "</span>" + highlight((start > 0 ? "…" : "") + cut, q);
          hm.appendChild(span);
        });
        if (r.matched.length > 3) hm.appendChild(el("span", "snip", "…另有 " + (r.matched.length - 3) + " 处"));
        hit.appendChild(hm);
        box.appendChild(hit);
      });
    });
  }

  /* ================= 会话内查找 ================= */
  function clearHits() {
    state.hits.forEach(function (n) {
      if (n.__orig != null) n.innerHTML = n.__orig;
      delete n.__orig;
    });
    state.hits = []; state.hitIdx = -1;
    document.getElementById("fcnt").textContent = "0/0";
  }

  function findInSession(q) {
    clearHits();
    if (!q || q.length < 1) return;
    var body = document.getElementById("dBody");
    var nodes = body.querySelectorAll(".bubble, details.fold > summary .t, details.fold .inner pre, .md li, .md p, .md td");
    var re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    var hits = [];
    nodes.forEach(function (n) {
      if (n.querySelector && n.querySelector("mark")) return;
      var html = n.innerHTML;
      if (html.indexOf("<mark>") >= 0) return;
      if (!re.test(n.textContent || "")) return;
      re.lastIndex = 0;
      n.__orig = html;
      n.innerHTML = esc(n.textContent || "").replace(re, "<mark>$&</mark>");
      hits.push(n);
    });
    state.hits = hits;
    state.hitIdx = hits.length ? 0 : -1;
    document.getElementById("fcnt").textContent = (hits.length ? 1 : 0) + "/" + hits.length;
    if (hits.length) jumpHit(0);
  }

  function jumpHit(i) {
    var hits = state.hits;
    if (!hits.length) return;
    state.hitIdx = (i + hits.length) % hits.length;
    var n = hits[state.hitIdx];
    var target = n.closest(".turn, details, .hit") || n;
    target.scrollIntoView({ block: "center" });
    document.getElementById("fcnt").textContent = (state.hitIdx + 1) + "/" + hits.length;
  }

  /* ================= 详情 ================= */
  function toMarkdown(shard) {
    var lines = ["# " + (shard.title || "(无标题)"), ""];
    lines.push("> 会话 ID：`" + shard.id + "`  ");
    lines.push("> 网页版：https://www.workbuddy.cn/app/conversation/" + shard.id);
    lines.push("");
    (shard.messages || []).forEach(function (m) {
      var r = m[0];
      if (r === "t") {
        lines.push("<details><summary>🔧 " + (m[3] || "工具调用") + (m[4] ? " · " + m[4] : "") + "</summary>");
        lines.push("");
        if (m[5]) { lines.push("**输入**", "```", m[5], "```"); }
        if (m[6]) { lines.push("**输出**", "```", m[6], "```"); }
        lines.push("", "</details>", "");
      } else if (r === "h") {
        lines.push("<details><summary>💭 思考过程</summary>", "", m[1] || "", "", "</details>", "");
      } else {
        lines.push("### " + (ROLE_NAME[r] || "消息"), "", m[1] || "", "");
      }
    });
    return lines.join("\n");
  }

  function openDetail(id, jumpIdx, findQ) {

    state.view = "detail";

    document.getElementById("dTitle").textContent = it.title;

    document.getElementById("dSub").textContent =
      (t ? t.abs + " · " : "") + label(it.origin) + " · " + (it.n || 0) + " 条 · " + it.id;
    document.getElementById("dFav").textContent = isFav(id) ? "★" : "☆";
    location.hash = "#/s/" + id + (jumpIdx != null ? "/" + jumpIdx : "");

    var body = document.getElementById("dBody");
    body.textContent = "";
    body.appendChild(stateBox("正在读取正文…", ""));
    log("open", id);

    loadSession(id, function (err, shard) {
      if (err) {
        log("shard", "miss " + err.message);
        body.textContent = "";
        var s = shard || { id: id, ok: false, messages: [] };
        s.id = id;
        body.appendChild(renderThread(s, null));
        return;
      }
      log("shard", "ok " + (shard.messages || []).length + " msgs");
      body.textContent = "";
      body.appendChild(renderThread(shard, jumpIdx));
      if (findQ && findQ.length >= 1) {
        document.getElementById("findbar").classList.add("on");
        document.getElementById("fq").value = findQ;
        setTimeout(function () { findInSession(findQ); }, 60);

      ["有正文", withBody.length],
      ["消息", msgs],
      ["工具调用", tools]
    ].forEach(function (p) {
      var c = el("div", "card");
      c.appendChild(el("div", "v", String(p[1])));
      c.appendChild(el("div", "k2", p[0]));
      cards.appendChild(c);
    });
    box.appendChild(cards);

    // 按来源
    box.appendChild(el("div", "sec-t", "按来源"));
    var max = Math.max.apply(null, Object.keys(DATA.counts).map(function (k) { return DATA.counts[k]; }).concat([1]));
    Object.keys(DATA.counts).sort(function (a, b) { return DATA.counts[b] - DATA.counts[a]; }).forEach(function (o) {
      var line = el("div", "barline");
      line.appendChild(el("div", "lb", label(o)));
      var tr = el("div", "tr");
      var fi = el("div", "fi");
      fi.style.width = Math.round((DATA.counts[o] / max) * 100) + "%";
      tr.appendChild(fi);
      line.appendChild(tr);
      line.appendChild(el("div", "nm", String(DATA.counts[o])));
      box.appendChild(line);
    });

    // 最近 30 天活跃
    box.appendChild(el("div", "sec-t", "最近 30 天活跃"));
    var days = [], now = new Date();
    now.setHours(0, 0, 0, 0);
    for (var i = 29; i >= 0; i--) {
      var d = new Date(now.getTime() - i * 86400000);
      days.push({ t: d.getTime(), n: 0, label: (d.getMonth() + 1) + "/" + d.getDate() });
    }
    items.forEach(function (it) {
      if (!it.ts) return;
      var dd = new Date(it.ts); dd.setHours(0, 0, 0, 0);
      var k = days.findIndex(function (x) { return x.t === dd.getTime(); });
      if (k >= 0) days[k].n++;
    });
    var dmax = Math.max.apply(null, days.map(function (x) { return x.n; }).concat([1]));
    var chart = el("div", "days");
    days.forEach(function (x) {
      var bar = document.createElement("i");
      bar.style.height = Math.max(2, Math.round((x.n / dmax) * 60)) + "px";
      bar.title = x.label + "：" + x.n + " 条";
      if (!x.n) bar.style.opacity = ".18";
      chart.appendChild(bar);
    });
    box.appendChild(chart);
    var axis = el("div", "days-x");
    axis.appendChild(el("span", null, days[0].label));
    axis.appendChild(el("span", null, days[14].label));
    axis.appendChild(el("span", null, days[29].label));
    box.appendChild(axis);

    // 最长的会话
    box.appendChild(el("div", "sec-t", "消息最多的会话"));
    items.slice().sort(function (a, b) { return (b.n || 0) - (a.n || 0); }).slice(0, 8).forEach(function (it) {
      var row = el("div", "row");
      row.onclick = function () { openDetail(it.id); };
      var body = el("div", "body");
      var name = el("div", "name", it.title);
      name.appendChild(el("span", "badge-n", (it.n || 0) + " 条"));
      body.appendChild(name);
      body.appendChild(el("div", "sub", label(it.origin) + " · " + (relTime(it.ts) ? relTime(it.ts).abs : "")));
      row.appendChild(el("span", "dot")).dataset.o = it.origin;
      row.appendChild(body);
      box.appendChild(row);
    });
  }

  /* ================= 路由 & 事件 ================= */
  function route() {
    var h = location.hash.replace(/^#/, "");
    if (/^\/s\//.test(h)) {
      var parts = h.split("/").filter(Boolean); // s, id, idx?
      var id = parts[1];
      var idx = parts[2] != null ? Number(parts[2]) : null;
      if (id && (!state.current || state.current.id !== id)) openDetail(id, idx);
      return;
    }
    if (h === "/stats") { openStats(); return; }
    if (/^\/q\//.test(h)) {
      var qq = decodeURIComponent(h.slice(3));
      document.getElementById("q").value = qq;
      document.getElementById("scope").value = "all";
      state.q = qq; state.scope = "all";
      if (state.view === "detail") closeDetail();
      render();
      return;
    }
    if (state.view === "detail") {
      document.getElementById("detailView").classList.remove("on");
      document.getElementById("listView").classList.remove("off");
      state.current = null;
    }
    if (state.view === "stats") {
      document.getElementById("statsView").classList.remove("on");
      document.getElementById("listView").classList.remove("off");
    }
    state.view = "list";
    render();
  }

  function render() {
    if (state.view === "search") renderSearch();
    else renderList();
  }

  var qTimer;
  document.getElementById("q").addEventListener("input", function (ev) {
    state.q = ev.target.value.trim();
    state.view = state.q ? "list" : "list";
    clearTimeout(qTimer);
    if (state.scope === "all" && state.q.length >= 2) {
      qTimer = setTimeout(function () { state.view = "search"; render(); }, 220);
    } else {
      render();
    }
  });
  document.getElementById("q").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") {
      state.q = ev.target.value.trim();
      if (state.q.length >= 2) {
        document.getElementById("scope").value = "all";
        state.scope = "all";
        state.view = "search";
        render();
      }
    } else if (ev.key === "Escape") {
      ev.target.value = ""; state.q = ""; state.view = "list"; render();
    }
  });
  document.getElementById("scope").addEventListener("change", function (ev) {
    state.scope = ev.target.value;
    if (state.scope === "all" && state.q.length >= 2) { state.view = "search"; render(); }
    else { state.view = "list"; render(); }
  });

  document.getElementById("back").onclick = closeDetail;
  document.getElementById("sBack").onclick = closeDetail;
  document.getElementById("statsBtn").onclick = openStats;
  document.getElementById("syncBtn").onclick = syncLive;

  document.getElementById("dWeb").onclick = function () {
    if (!state.current) return;
    openExternal(webUrl(state.current.id));
  };
  document.getElementById("webBtn").onclick = function () { openExternal(WEB + "/app"); };

  document.getElementById("dCopy").onclick = function () {
    if (state.current) copy(state.current.id, "已复制会话 ID");
  };
  document.getElementById("fillOk").onclick = closeFillHint;
  document.getElementById("fillCopy").onclick = function () {
    if (!fillCtx) return;
    copy(fillCtx, "已复制 " + fillCtx.length + " 字上下文，回对话页 Ctrl+V 即可");
    closeFillHint();
  };
  document.getElementById("fillModal").onclick = function (ev) {
    if (ev.target && ev.target.id === "fillModal") closeFillHint();
  };
  document.getElementById("dFav").onclick = function () {
    if (!state.current) return;
    var added = toggleFav(state.current.id);
    document.getElementById("dFav").textContent = added ? "★" : "☆";
    toast(added ? "已收藏（列表置顶）" : "已取消收藏");
  };
  document.getElementById("dMd").onclick = function () {
    if (!state.current) return;
    loadSession(state.current.id, function (err, shard) {
      if (err || !shard) return toast("这条会话没有本地正文");
      var md = toMarkdown(shard);
      copy(md, "已复制 " + md.length + " 字符 Markdown");
    });
  };

  document.getElementById("dChat").onclick = function () {
    if (state.current) openSessionInClient(state.current.id);
  };
  document.getElementById("dFill").onclick = continueChat;

  // 会话内查找
  function openFind() {
    document.getElementById("findbar").classList.add("on");
    var fq = document.getElementById("fq");
    fq.focus(); fq.select();
  }
  document.getElementById("dFind").onclick = openFind;
  document.getElementById("fclose").onclick = function () {
    document.getElementById("findbar").classList.remove("on");
    clearHits();
  };
  document.getElementById("fprev").onclick = function () { jumpHit(state.hitIdx - 1); };
  document.getElementById("fnext").onclick = function () { jumpHit(state.hitIdx + 1); };
  var fTimer;
  document.getElementById("fq").addEventListener("input", function (ev) {
    clearTimeout(fTimer);
    var v = ev.target.value;
    fTimer = setTimeout(function () { findInSession(v); }, 200);
  });
  document.getElementById("fq").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") {
      ev.preventDefault();
      if (ev.shiftKey) jumpHit(state.hitIdx - 1); else jumpHit(state.hitIdx + 1);
    } else if (ev.key === "Escape") {
      document.getElementById("fclose").onclick();
    }
  });

  // 键盘
  document.addEventListener("keydown", function (ev) {
    var tag = (ev.target && ev.target.tagName || "").toLowerCase();
    var typing = tag === "input" || tag === "select" || tag === "textarea";

    if (ev.key === "Escape" && !typing) {
      var fm = document.getElementById("fillModal");
      if (fm && !fm.hidden) { closeFillHint(); return; }
      if (state.view === "detail" || state.view === "stats") closeDetail();
      return;
    }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "f") {
      if (state.view === "detail") { ev.preventDefault(); openFind(); }
      return;
    }
    if (typing) return;

    if (ev.key === "/") { ev.preventDefault(); document.getElementById("q").focus(); return; }
    if (ev.key === "r") { syncLive(); return; }
    if (ev.key === "?" ) { openStats(); return; }
    if (state.view !== "list" && state.view !== "search") return;

    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      var rows = document.querySelectorAll("#listView .row, #listView .hit");
      if (!rows.length) return;
      var cur = document.querySelector("#listView .row.sel, #listView .hit.sel");
      var i = cur ? Array.prototype.indexOf.call(rows, cur) : -1;
      if (cur) cur.classList.remove("sel");
      i = ev.key === "ArrowDown" ? Math.min(rows.length - 1, i + 1) : Math.max(0, i - 1);
      rows[i].classList.add("sel");
      rows[i].scrollIntoView({ block: "nearest" });
      return;
    }
    if (ev.key === "Enter") {
      var sel = document.querySelector("#listView .row.sel, #listView .hit.sel");
      if (sel) sel.click();
    }
  });
  window.addEventListener("hashchange", route);

  /* ================= 启动 ================= */
  (function boot() {
    routeLinks(document.getElementById("dBody"));

    // 诊断信息（宿主通道状态是排查「插件加载失败」的关键）
    function refreshDiag() {
      var out = [];
      var g = window.__WBCS_GUEST__ || null;
      out.push("snapshot  : " + DATA.generatedAt + " / " + DATA.total + " 条");
      out.push("url       : " + location.href);
      out.push("origin    : " + location.origin);
      out.push("in iframe : " + (window.parent !== window));
      out.push("宿主通道  : " + (g && g.port
        ? ("MessagePort" + (g.ready ? "（ready 已确认）" : "（ready 未确认）"))
        : "未建立（只剩浏览器兜底）"));
      if (g && g.lines && g.lines.length) out.push("guest     : " + g.lines.join(" | "));
      setDiagHeader(out);
    }
    refreshDiag();
    [300, 1500, 4000, 8000].forEach(function (ms) { setTimeout(refreshDiag, ms); });

    // 分片索引（哪些会话有本地正文）
    var s = document.createElement("script");
    s.src = "./full/index.js";
    s.onload = function () {
      var meta = window.__WBCS_INDEX__ || {};
      (meta.items || []).forEach(function (x) { INDEX[x.id] = x; });
      // 用分片统计修正列表里的条数（DB 里没有正文条数）
      DATA.items.forEach(function (it) {
        var m = INDEX[it.id];
        if (m) it.n = m.n;
      });
      log("full/index", (meta.total || 0) + " 份正文，合计 " + Math.round((meta.bytes || 0) / 1024) + " KB");
      if (state.view !== "detail" && state.view !== "stats") render();
    };
    s.onerror = function () { log("full/index", "没有本地正文分片（先跑 build）"); };
    document.head.appendChild(s);

    // 宿主桥 / 主题：等 MessagePort 建好（宿主在 iframe load 后马上发），
    // 最多等 4s；等不到就当作纯浏览器环境，直接降级。
    (function bridgeUp() {
      var g = window.__WBCS_GUEST__;
      if (g && !g.port && window.parent !== window) {
        var tries = 0;
        var iv = setInterval(function () {
          if ((g && g.port) || ++tries > 40) { clearInterval(iv); finish(); }
        }, 100);
      } else {
        finish();
      }

      function finish() {
        Bridge.handshake(800).then(function () {
          log("bridge", "ok via " + Bridge.via());
          refreshDiag();
          return Bridge.invoke("wb:config:get", ["theme"], 3000).then(function (t) {
            var v = typeof t === "string" ? t : (t && (t.theme || t.mode));
            if (v === "dark" || v === "light") {
              document.documentElement.dataset.theme = v;
              log("theme", v);
            }
          }).catch(function () {});
        }).catch(function (e) {
          log("bridge", "unavailable: " + e.message);
          refreshDiag();
        });
      }
    })();

    route();

    // 版本自检：宿主的扩展清单在启动时快照，热部署后 URL 上的 v= 还是旧版本。
    // 出现不一致说明「文件已经换了、宿主还没重新扫」——重启即可，不是网络问题。
    (function versionCheck() {
      var want = "";
      try { want = (new URLSearchParams(location.search).get("v") || "").trim(); } catch (e) {}
      log("version", "host=" + (want || "-") + " disk=" + PAGE_VERSION);
      if (!want || want === PAGE_VERSION) return;
      var bar = el("div", "vbar");
      bar.appendChild(el("span", "vbar-txt",
        "版本不一致：宿主仍在用 v" + want + " 的清单，磁盘上已经是 v" + PAGE_VERSION +
        "。这是更新后没重启导致的（面板可能会报「插件加载失败」）。完全退出 WorkBuddy 再打开即可。" ));
      var btn = el("button", null, "知道了");
      btn.onclick = function () { bar.remove(); };
      bar.appendChild(btn);
      var m = document.getElementById("main");
      if (m) m.insertBefore(bar, m.firstChild);
    })();
  })();
})();
</script>
</body>
</html>
